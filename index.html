<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>导航主页</title>
    <style>
        body {
            font-family: system-ui;
            text-align: center;
            margin-top: 100px;
            background-color: #fff7ed; /* 暖米色背景，柔和温馨，护眼 */
        }
        h1 {
            color: #431407;
            margin-bottom: 40px;
        }
        a {
            display: inline-block;
            padding: 18px 36px;
            font-size: 20px;
            background: #ea580c; /* 暖橙色按钮，温和醒目，不刺眼 */
            color: #fff;
            text-decoration: none;
            border-radius: 12px;
            margin: 12px;
            transition: all 0.25s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        a:hover {
            background: #c2410c;
            transform: translateY(-2px); /* 悬浮轻微上浮，增加互动感 */
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>
    <h1>欢迎访问</h1>
    <a href="./shijianzhou/">打开复兴之路时间轴网页</a>
    <a href="./datishuyusuca/">打开答题术语速查网页</a>
    <a href="./9shangquancefuxi/">打开九上全册复习与练习</a>
</body>
</html>
