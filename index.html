<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>导航主页</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui;
            text-align: center;
            min-height: 100vh;
            background-color: #f5efe1;
            background-image:
                linear-gradient(rgba(245, 239, 225, 0.65), rgba(245, 239, 225, 0.65)),
                url("https://img.icons8.com/fluency-systems-regular/96/b5884a/cloud.png"),
                url("https://img.icons8.com/fluency-systems-regular/96/b5884a/mountain.png");
            background-repeat: no-repeat;
            background-position: left 8% top 10%, right 8% bottom 12%;
            background-size: 140px, 180px;
            padding: 80px 20px 40px;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            color: #5b4636;
            margin-bottom: 12px;
            font-size: 32px;
        }

        .subtitle {
            color: #7a6552;
            margin-bottom: 48px;
            font-size: 16px;
            letter-spacing: 1px;
        }

        a {
            display: inline-block;
            padding: 18px 36px;
            font-size: 20px;
            background: #b5884a;
            color: #fff;
            text-decoration: none;
            border-radius: 12px;
            margin: 12px;
            transition: all 0.25s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        a:hover {
            background: #966c3d;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
        }

        .footer-tip {
            margin-top: 60px;
            color: #8a7560;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>欢迎访问道德与法治学习资源库</h1>
        <p class="subtitle">复兴之路 · 答题术语速查 · 九上全册复习</p>

        <a href="./shijianzhou/">打开复兴之路时间轴网页</a>
        <a href="./datishuyusuca/">打开答题术语速查网页</a>
        <a href="./9shangquancefuxi/">打开九上全册复习与练习</a>

        <p class="footer-tip">选择学习入口，开始今天的复习</p>
    </div>
</body>
</html>
