/* ===================== 基础 ===================== */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Songti SC","STSong","SimSun","Noto Serif CJK SC","Source Han Serif SC",serif;
  -webkit-font-smoothing:antialiased;color:#241C14;
  background:radial-gradient(120% 120% at 50% 0%,#221D19 0%,#141110 70%);
  background-attachment:fixed;
}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid #8C2F1F;outline-offset:3px}

/* ===================== 电脑端：16:9 舞台（默认） ===================== */
html{width:100%;height:100%;overflow:hidden}
html.is-flow{height:auto;overflow-x:hidden;overflow-y:auto}
html.is-flow body{height:auto;overflow:visible}

#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;
  margin:-360px 0 0 -640px;transform-origin:center center;
  background:#1F2A29;overflow:hidden;
  box-shadow:0 34px 90px rgba(0,0,0,.72),0 0 0 1px rgba(255,255,255,.05)}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;
  transition:opacity .34s ease;overflow:hidden}
.slide.on{opacity:1;visibility:visible}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat}
.bg::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(20,17,16,.10) 0%,rgba(20,17,16,0) 26%,rgba(20,17,16,0) 74%,rgba(20,17,16,.14) 100%)}

/* —— 深色页 —— */
.dark{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
  padding:0 92px;color:#EFE6D3}
.dark .ghost{position:absolute;right:-24px;bottom:-96px;font-size:340px;line-height:1;
  font-weight:800;color:rgba(255,255,255,.035);letter-spacing:-.04em;user-select:none;pointer-events:none}
.dark .kick{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:700;
  color:#D9B98A;letter-spacing:.16em}
.dark .kick::before{content:"";width:34px;height:2px;background:#D9B98A;flex:0 0 auto}
.dark .tt{font-size:52px;line-height:1.3;font-weight:800;margin:22px 0 0;letter-spacing:.01em;color:#EFE6D3}
.dark .tt em{font-style:normal;color:#D9B98A}
.dark .lead{margin-top:20px;font-size:23px;line-height:1.8;color:#C9BFAE;max-width:900px}
.inner{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center;max-width:1010px}

/* —— 封面 —— */
.cover-veil{position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(250,244,231,.97) 0%,rgba(250,244,231,.95) 42%,rgba(250,244,231,.55) 62%,rgba(250,244,231,.06) 88%)}
.cover-inner{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;
  height:100%;padding:0 92px;max-width:820px}
.cover-inner .kick{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:700;
  color:#8C2F1F;letter-spacing:.14em}
.cover-inner .kick::before{content:"";width:40px;height:2px;background:#8C2F1F}
.cover-tt{font-size:76px;line-height:1.2;font-weight:800;margin:26px 0 0;color:#241C14;letter-spacing:.01em}
.cover-sub{margin-top:22px;font-size:22px;color:#5A4A38;letter-spacing:.06em}
.cover-sum{margin-top:34px;font-size:26px;color:#8C2F1F;font-weight:700;letter-spacing:.02em}
.cover-sum::before{content:"— ";opacity:.6}

/* —— 目录 —— */
.toc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 26px;margin-top:34px}
.toc-row{display:flex;align-items:center;gap:16px;width:100%;text-align:left;
  padding:14px 16px;border:1px solid rgba(255,255,255,.09);border-radius:3px;
  background:rgba(255,255,255,.02);transition:all .18s ease}
.toc-row:hover{border-color:#8C2F1F;background:rgba(140,47,31,.12)}
.toc-row .no{font-size:14px;color:#D9B98A;letter-spacing:.1em;font-family:"Helvetica Neue",Arial,sans-serif}
.toc-row .nm{flex:1;font-size:21px;color:#EDE3D0;font-weight:700}
.toc-row .pg{font-size:13px;color:#9C9182;font-family:"Helvetica Neue",Arial,sans-serif}

/* —— 单元页 —— */
.sec-rule{width:96px;height:3px;background:#8C2F1F;margin-bottom:30px}

/* —— 术语页（左右分栏） —— */
.term-col{position:absolute;top:0;bottom:0;padding:46px 26px 20px;z-index:2}
.veil{position:absolute;inset:-26px -30px;z-index:0;pointer-events:none;
  background:radial-gradient(104% 96% at 50% 50%,
    rgba(249,243,230,.965) 0%,rgba(249,243,230,.94) 40%,
    rgba(249,243,230,.68) 64%,rgba(249,243,230,.16) 84%,rgba(249,243,230,0) 97%)}
.face{position:relative;z-index:1;display:flex;flex-direction:column;height:100%}
.kick{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;
  color:#8C2F1F;letter-spacing:.05em}
.kick::before{content:"";width:26px;height:2px;background:#8C2F1F;flex:0 0 auto}
.tt{font-size:40px;line-height:1.28;font-weight:800;color:#241C14;margin:14px 0 0}
.tt em{font-style:normal;color:#8C2F1F}
.kwrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px}
.qp{font-size:14px;color:#8C2F1F;letter-spacing:.08em;font-weight:700;
  border-left:3px solid #8C2F1F;padding-left:8px}
.kw{font-size:15px;padding:4px 10px;background:rgba(140,47,31,.08);color:#6B3A26;border-radius:2px}
.card{position:relative;flex:1;margin-top:16px;border-left:3px solid #8C2F1F;
  background:rgba(255,255,255,.5);padding:18px 20px;overflow:auto;min-height:0}
.card[hidden]{display:none!important}
.card.masked{display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:repeating-linear-gradient(135deg,rgba(140,47,31,.045) 0 8px,transparent 8px 16px)}
.seal{text-align:center}
.seal .stamp{display:inline-block;padding:10px 18px;border:2px solid #8C2F1F;color:#8C2F1F;
  font-size:26px;font-weight:800;letter-spacing:.24em}
.seal .hint{font-size:16px;color:#8C2F1F;letter-spacing:.1em;opacity:.75;margin-top:12px}
.ans{list-style:none;margin:0;padding:0;counter-reset:a}
.ans li{font-size:19px;line-height:1.72;color:#2A2119;margin-bottom:10px;text-indent:-.1em}
.ans li:last-child{margin-bottom:0}
.sumline{margin-top:14px;padding-top:12px;border-top:1px dashed rgba(140,47,31,.35);
  font-size:17px;color:#8C2F1F;font-weight:700;line-height:1.6}
.term-col.dens-M .ans li{font-size:17.5px;line-height:1.66}
.term-col.dens-M .tt{font-size:36px}
.term-col.dens-S .ans li{font-size:16px;line-height:1.6}
.term-col.dens-S .tt{font-size:32px}

/* —— 知识框架 —— */
.mm{position:relative;flex:1;margin-top:10px}
.mm-root{display:inline-block;padding:12px 26px;background:#8C2F1F;color:#FAF4E7;
  font-size:24px;font-weight:800;letter-spacing:.14em;border-radius:2px}
.mm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:26px}
.mm-col{border-top:2px solid #8C2F1F;padding-top:12px}
.mm-col h4{margin:0 0 10px;font-size:20px;color:#8C2F1F;font-weight:800;letter-spacing:.06em}
.mm-node{display:block;width:100%;text-align:left;padding:8px 10px;margin-bottom:7px;
  border:1px solid rgba(140,47,31,.28);font-size:16px;color:#3A2C20;border-radius:2px;
  background:rgba(255,255,255,.55);transition:all .16s}
.mm-node:hover{border-color:#8C2F1F}
.mm-node.done{background:#8C2F1F;color:#FAF4E7;border-color:#8C2F1F}
.mm-notes{display:flex;gap:22px;margin-top:18px;flex-wrap:wrap}
.mm-notes span{font-size:14px;color:#7A5A40;letter-spacing:.04em}
.mm-notes span::before{content:"· ";color:#8C2F1F;font-weight:800}

/* —— 判断题 —— */
.jlist{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.jitem{border:1px solid rgba(255,255,255,.1);border-radius:3px;padding:12px 16px;
  background:rgba(255,255,255,.025)}
.jtext{font-size:19px;line-height:1.6;color:#EDE3D0}
.jbtns{display:flex;gap:8px;margin-top:10px}
.jbtns button{padding:5px 18px;border:1px solid rgba(255,255,255,.18);border-radius:2px;
  font-size:14px;color:#D6CBB6;letter-spacing:.1em;transition:all .15s}
.jbtns button:hover{border-color:#D9B98A}
.jbtns button.ok{background:#2E5D4B;border-color:#2E5D4B;color:#F2EAD9}
.jbtns button.no{background:#8C2F1F;border-color:#8C2F1F;color:#F2EAD9}
.jres{margin-left:10px;font-size:14px;color:#D9B98A;letter-spacing:.06em;align-self:center}

/* —— 配对 —— */
.mgrid{margin-top:18px;display:grid;grid-template-columns:1fr 44px 1fr;gap:12px 0;
  align-items:center}
.mitem{width:100%;text-align:left;padding:11px 14px;border:1px solid rgba(255,255,255,.14);
  border-radius:2px;font-size:17px;color:#EDE3D0;background:rgba(255,255,255,.03);
  transition:all .16s;line-height:1.5}
.mitem:hover{border-color:#D9B98A}
.mitem.sel{border-color:#D9B98A;background:rgba(217,185,138,.16)}
.mitem.matched{opacity:.45;border-style:dashed;border-color:#2E5D4B;pointer-events:none}
.marrow{text-align:center;color:#8C7A62;font-size:15px}

/* —— 作业页 —— */
.hw{margin-top:34px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.hwcard{border-top:2px solid;padding-top:14px}
.hwcard .tag{display:inline-block;font-size:14px;font-weight:800;letter-spacing:.16em;
  padding:2px 10px;color:#FAF4E7;border-radius:2px}
.hwcard p{margin:12px 0 0;font-size:17px;line-height:1.7;color:#D9CEB9}

/* ===================== 浮动控件（桌面） ===================== */
#hud{position:fixed;inset:0;pointer-events:none;z-index:50}
#bar{position:absolute;left:0;top:0;width:100%;height:2px;background:rgba(255,255,255,.09)}
#bar i{display:block;height:100%;width:0;background:#8C2F1F;transition:width .3s ease;
  box-shadow:0 0 12px rgba(140,47,31,.8)}
#nav{position:absolute;left:50%;bottom:11px;transform:translateX(-50%);
  display:flex;align-items:center;gap:4px;pointer-events:auto;
  background:rgba(20,17,16,.6);border:1px solid rgba(255,255,255,.1);
  border-radius:999px;padding:4px 6px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);opacity:.55;
  transition:opacity .25s ease}
#nav:hover{opacity:1}
#nav button{width:30px;height:26px;border-radius:999px;color:#E6DCC9;font-size:17px;
  line-height:1;transition:background .15s}
#nav button:hover{background:rgba(255,255,255,.12)}
#pn{font-size:12px;color:#C9BFAE;letter-spacing:.1em;padding:0 8px;font-variant-numeric:tabular-nums;
  font-family:"Helvetica Neue",Arial,sans-serif;min-width:66px;text-align:center}
#tools{position:absolute;right:22px;bottom:11px;display:flex;gap:8px;pointer-events:auto;
  opacity:.5;transition:opacity .25s ease}
#tools:hover{opacity:1}
#tools button{border:1px solid rgba(255,255,255,.14);border-radius:2px;padding:6px 12px;
  font-size:12px;color:#D6CBB6;letter-spacing:.1em;background:rgba(20,17,16,.6);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:all .16s}
#tools button:hover{border-color:#8C2F1F;color:#E9DCC4}
#hint{position:absolute;left:24px;bottom:15px;font-size:12px;color:rgba(230,220,201,.32);
  letter-spacing:.1em}

/* 目录浮层 */
#overlay{position:fixed;inset:0;z-index:60;background:rgba(14,12,11,.94);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;padding:6vh 8vw;overflow:auto;-webkit-overflow-scrolling:touch}
#overlay.on{display:block}
#overlay h3{color:#D9B98A;font-size:20px;letter-spacing:.2em;font-weight:700;margin:0 0 26px}
#ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px 26px}
#ovclose{position:absolute;right:20px;top:16px;padding:8px 14px;border:1px solid rgba(255,255,255,.2);
  color:#C9BFAE;font-size:13px;letter-spacing:.1em;border-radius:2px;z-index:2}
.ovitem{display:flex;gap:12px;align-items:baseline;width:100%;text-align:left;padding:9px 10px;
  color:#D9CEB9;font-size:15px;border-bottom:1px solid rgba(255,255,255,.05);border-radius:2px}
.ovitem:hover{background:rgba(255,255,255,.06)}
.ovitem .n{font-size:12px;color:#8C7A62;font-family:"Helvetica Neue",Arial,sans-serif;min-width:24px}
.ovitem.cur{color:#F0E3C8;background:rgba(140,47,31,.22)}

/* ===================== 手机端：纵向卡片流 ===================== */
html.is-flow,html.is-flow body{height:auto;overflow-x:hidden;overflow-y:auto}
html.is-flow #stage{position:static;left:auto;top:auto;width:100%;height:auto;margin:0;
  transform:none!important;overflow:visible;box-shadow:none;background:transparent}
html.is-flow .slide{position:relative;inset:auto;opacity:1;visibility:visible;
  transition:none;overflow:visible;display:none}
html.is-flow .slide.on{display:block}

html.is-flow #hud{position:sticky;bottom:0;inset:auto;height:0;z-index:120}
html.is-flow #bar{position:fixed;top:0;height:3px;z-index:130}
html.is-flow #nav{position:fixed;left:12px;right:auto;transform:none;bottom:calc(12px + env(safe-area-inset-bottom));
  opacity:.96;padding:5px 8px;box-shadow:0 8px 26px rgba(0,0,0,.5)}
html.is-flow #nav button{width:44px;height:40px;font-size:22px}
html.is-flow #pn{font-size:13px;min-width:58px}
html.is-flow #tools{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));
  opacity:.96;flex-wrap:wrap;justify-content:flex-end;max-width:44vw;gap:6px}
html.is-flow #tools button{height:40px;padding:0 10px;font-size:12px;white-space:nowrap}
html.is-flow #tools #modeBtn{padding:0 8px}
html.is-flow #hint{display:none}
html.is-flow #overlay{padding:calc(16px + env(safe-area-inset-top)) 18px 90px}
html.is-flow #ovgrid{grid-template-columns:1fr}
html.is-flow .ovitem{padding:14px 8px;font-size:16px}

/* 手机端各页版式 */
html.is-flow .slide{min-height:auto}

/* 封面 */
html.is-flow .t-cover{position:relative;background:#F7F0E2;
  border-bottom:1px solid rgba(140,47,31,.18)}
html.is-flow .t-cover .bg{position:absolute;left:0;right:0;bottom:0;top:auto;height:210px;
  background-size:cover;background-position:center 60%;inset:auto 0 0 0}
html.is-flow .t-cover .bg::after{background:linear-gradient(180deg,#F7F0E2 0%,rgba(247,240,226,.25) 60%,rgba(247,240,226,.05) 100%)}
html.is-flow .cover-veil{display:none}
html.is-flow .cover-inner{padding:calc(46px + env(safe-area-inset-top)) 22px 200px;max-width:none}
html.is-flow .cover-inner .kick{font-size:13px;letter-spacing:.12em;gap:8px}
html.is-flow .cover-inner .kick::before{width:24px}
html.is-flow .cover-tt{font-size:clamp(30px,8.4vw,42px);line-height:1.25;margin-top:16px}
html.is-flow .cover-sub{margin-top:14px;font-size:14px;line-height:1.7}
html.is-flow .cover-sum{margin-top:18px;font-size:16px;line-height:1.6}

/* 深色页 */
html.is-flow .dark{position:static;padding:38px 22px 40px;justify-content:flex-start}
html.is-flow .dark .ghost{font-size:150px;right:-10px;bottom:-30px;line-height:1}
html.is-flow .inner{max-width:none}
html.is-flow .dark .kick{font-size:13px;gap:8px;letter-spacing:.12em}
html.is-flow .dark .kick::before{width:22px}
html.is-flow .dark .tt{font-size:clamp(26px,7.4vw,34px);margin-top:12px}
html.is-flow .dark .lead{margin-top:12px;font-size:15px;line-height:1.75}
html.is-flow .sec-rule{width:56px;height:2px;margin-bottom:16px}

/* 目录 */
html.is-flow .toc-grid{grid-template-columns:1fr;gap:8px;margin-top:22px}
html.is-flow .toc-row{padding:15px 14px;gap:12px}
html.is-flow .toc-row .nm{font-size:16px}
html.is-flow .toc-row .no{font-size:12px}

/* 术语页 */
html.is-flow .t-term{position:relative;background:#FAF4E7;padding:26px 0 0}
html.is-flow .t-term .bg{position:relative;height:150px;margin:0 0 -26px;
  background-size:cover;background-position:center 55%}
html.is-flow .t-term .bg::after{background:linear-gradient(180deg,rgba(250,244,231,.1) 0%,rgba(250,244,231,.85) 72%,#FAF4E7 100%)}
html.is-flow .term-col{position:static;padding:0 20px 24px;top:auto;bottom:auto}
html.is-flow .veil{display:none}
html.is-flow .face{height:auto}
html.is-flow .t-term .kick{font-size:13px;gap:8px}
html.is-flow .t-term .kick::before{width:20px}
html.is-flow .t-term .tt,html.is-flow .t-term .dens-M .tt,html.is-flow .t-term .dens-S .tt{
  font-size:clamp(22px,6.6vw,28px);line-height:1.35;margin-top:10px}
html.is-flow .kwrow{margin-top:12px;gap:7px}
html.is-flow .qp{font-size:12px}
html.is-flow .kw{font-size:12.5px;padding:4px 9px}
html.is-flow .card{flex:none;margin-top:14px;padding:16px 14px;max-height:none;overflow:visible;
  border-left-width:3px;border-radius:2px;background:rgba(255,255,255,.62);
  box-shadow:0 1px 0 rgba(140,47,31,.08)}
html.is-flow .card.masked{min-height:148px}
html.is-flow .seal .stamp{font-size:20px;padding:8px 16px}
html.is-flow .seal .hint{font-size:12.5px;margin-top:10px}
html.is-flow .ans li,html.is-flow .term-col.dens-M .ans li,html.is-flow .term-col.dens-S .ans li{
  font-size:15.5px;line-height:1.8;margin-bottom:12px}
html.is-flow .sumline{font-size:14px;line-height:1.7}

/* 知识框架 */
html.is-flow .mm{margin-top:6px}
html.is-flow .mm-root{font-size:17px;padding:9px 20px}
html.is-flow .mm-grid{grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
html.is-flow .mm-col h4{font-size:16px;margin-bottom:8px}

html.is-flow .mm-notes{gap:10px 16px;margin-top:16px}

/* 判断 */
html.is-flow .jlist{gap:9px;margin-top:18px}
html.is-flow .jitem{padding:13px 13px}
html.is-flow .jtext{font-size:15px;line-height:1.7}
html.is-flow .jbtns{gap:8px;margin-top:11px;flex-wrap:wrap}
html.is-flow .jbtns button{padding:9px 22px;font-size:14px;min-width:64px}
html.is-flow .jres{font-size:13px;margin-left:4px}

/* 配对 */
html.is-flow .mgrid{grid-template-columns:1fr;gap:8px;margin-top:16px}
html.is-flow .mitem{font-size:15px;padding:13px 12px;min-height:46px}
html.is-flow .marrow{display:none}

/* 作业 */
html.is-flow .hw{grid-template-columns:1fr;gap:14px;margin-top:20px}
html.is-flow .hwcard{padding-top:12px}
html.is-flow .hwcard .tag{font-size:12px}
html.is-flow .hwcard p{font-size:15px;margin-top:9px}

/* 页尾留白，避免被底部控件遮挡 */
html.is-flow #stage{padding-bottom:calc(96px + env(safe-area-inset-bottom))}

s": ["民主选举", "民主协商", "村委会", "立法司法"], "answer": ["①公民依法行使民主权利，通过民主选举、民主协商、民主决策、民主管理、民主监督参与管理国家和社会事务。", "②协商民主广泛深入发展：有事好商量，众人的事情由众人商量，是人民民主的真谛。", "③基层民主活力增强，健全党组织领导的城乡基层治理体系。", "④法治中国建设迈出坚实步伐；民主是法治的基础，法治是民主的保障，法治建设维护社会公平正义。"], "summary": "民主不是口号，选举、协商、基层、法治四条腿。"}, {"t": "term", "bg": "b3", "x": 688, "w": 556, "dens": "L", "kicker": "第六课第三框 · 教材 P54—P57", "title": "文化自信：最基本、最深沉、最持久", "titlePre": "文化自信：", "titlePost": "最基本、最深沉、最持久", "qprefix": "关键词", "keywords": ["意识形态", "核心价值观", "非遗文物", "文艺创作"], "answer": ["文化自信是更基础、更广泛、更深厚的自信，是最基本、最深沉、最持久的力量。确立马克思主义在意识形态领域指导地位的根本制度；把社会主义核心价值观作为凝魂聚气、强基固本的基础工程；推动中华优秀传统文化创造性转化、创新性发展；坚持以人民为中心的创作导向，文艺呈现百花齐放。"], "summary": "一个自信，四根支柱。"}, {"t": "term", "bg": "b6", "x": 350, "w": 880, "dens": "L", "kicker": "第六课第四框 · 教材 P57—P60", "title": "民生福祉：发展的根本目的", "titlePre": "", "titlePost": "", "qprefix": "关键词", "keywords": ["脱贫攻坚", "教育公平", "医保养老", "扫黑除恶"], "answer": ["①增进民生福祉是发展的根本目的，党把让老百姓过上好日子作为一切工作的出发点和落脚点，补齐民生保障短板，解决好人民群众急难愁盼问题。", "②完成脱贫攻坚、全面建成小康社会的历史任务，历史性地解决了绝对贫困问题，创造人类减贫史上的奇迹。", "③建成世界上规模最大的教育体系和社会保障体系。", "④平安中国建设迈向更高水平，完善共建共治共享的社会治理制度。"], "summary": "脱贫、教育、社保、平安，民生四件大事。"}, {"t": "term", "bg": "b3", "x": 688, "w": 556, "dens": "S", "kicker": "第六课第五框 · 教材 P61—P63", "title": "美丽中国：绿水青山就是金山银山", "titlePre": "美丽中国：", "titlePost": "绿水青山就是金山银山", "qprefix": "关键词", "keywords": ["生态环境法典", "蓝天碧水净土", "垃圾分类", "绿色生活"], "answer": ["①保护自然就是保护人类，建设生态文明就是造福人类，坚持山水林田湖草沙一体治理。", "②生态文明制度体系更加健全，协同推进降碳、减污、扩绿、增长。", "③污染防治攻坚向纵深推进，坚持精准、科学、依法治污，城乡人居环境持续改善。", "④绿色、循环、低碳发展迈出坚实步伐，简约适度的生活方式深入人心。"], "summary": "制度、治污、绿色生活：三步走到美丽中国。"}, {"t": "section", "ghost": "03", "kicker": "第三单元", "title": "奋进新征程", "lead": "第七课—第八课 · 术语 39—43 · 蓝图与路径"}, {"t": "term", "bg": "b2", "x": 470, "w": 780, "dens": "L", "kicker": "第七课 · 教材 P70—P71", "title": "蓝图：两步走", "titlePre": "", "titlePost": "", "qprefix": "关键词", "keywords": ["2035", "本世纪中叶", "两步走"], "answer": ["第一步，从 2020 年到 2035 年，基本实现社会主义现代化；第二步，从 2035 年到本世纪中叶，把我国建成富强民主文明和谐美丽的社会主义现代化强国。这一战略对动员全国各族人民万众一心为实现民族复兴团结奋斗具有重大意义。"], "summary": "十五年基本实现，再十五年建成强国。"}, {"t": "term", "bg": "b5", "x": 60, "w": 680, "dens": "L", "kicker": "第七课 · 教材 P72—P74", "title": "中国式现代化的五个特色", "titlePre": "", "titlePost": "", "qprefix": "关键词", "keywords": ["中国式现代化", "五个中国特色"], "answer": ["新时代新征程，党的中心任务是以中国式现代化全面推进中华民族伟大复兴。中国式现代化是中国共产党领导的社会主义现代化，具有五大特色：人口规模巨大、全体人民共同富裕、物质文明和精神文明相协调、人与自然和谐共生、走和平发展道路。实践证明，中国式现代化走得通、行得稳，是强国建设、民族复兴的唯一正确道路。"], "summary": "五个特色，一条道路，一个中心任务。"}, {"t": "term", "bg": "b2", "x": 470, "w": 780, "dens": "L", "kicker": "第八课 · 教材 P77—P78", "title": "新发展理念：指挥棒与红绿灯", "titlePre": "", "titlePost": "", "qprefix": "关键词", "keywords": ["创新", "协调", "绿色", "开放", "共享"], "answer": ["理念是行动的先导。创新、协调、绿色、开放、共享是新发展理念，它是指挥棒、红绿灯。创新是第一动力，协调是内在要求，绿色是必要条件，开放是必由之路，共享是本质要求。"], "summary": "五个理念五个定位，一句话记全。"}, {"t": "term", "bg": "b5", "x": 60, "w": 680, "dens": "L", "kicker": "第八课 · 教材 P76 · P79—P82", "title": "新发展格局与高质量发展", "titlePre": "", "titlePost": "", "qprefix": "关键词", "keywords": ["双循环", "新发展格局", "新质生产力", "科教兴国"], "answer": ["①新发展格局是以国内大循环为主体、国内国际双循环相互促进的发展格局，最本质特征是实现高水平的自立自强。", "②我国经济已由高速增长阶段转向高质量发展阶段，高质量发展是全面建设社会主义现代化国家的首要任务。必须发展新质生产力，坚持科技是第一生产力、人才是第一资源、创新是第一动力，深入实施科教兴国、人才强国、创新驱动发展战略。"], "summary": "格局保安全，质量定成败。"}, {"t": "section", "ghost": "04", "kicker": "第四单元", "title": "共圆中国梦", "lead": "第九课—第十课 · 术语 44—49 · 团结、统一、复兴"}, {"t": "term", "bg": "b2", "x": 470, "w": 780, "dens": "L", "kicker": "第九课 · 教材 P87—P89", "title": "铸牢中华民族共同体意识", "titlePre": "", "titlePost": "", "qprefix": "关键词", "keywords": ["援疆援藏", "石榴籽", "四个与共"], "answer": ["铸牢中华民族共同体意识是新时代党的民族工作的主线。要牢固树立休戚与共、荣辱与共、生死与共、命运与共的共同体理念，促进各民族共同团结奋斗、共同繁荣发展。青少年要尊重各民族风俗习惯，反对民族分裂言行。"], "summary": "一条主线，四个与共。"}, {"t": "term", "bg": "b3", "x": 688, "w": 556, "dens": "L", "kicker": "第九课 · 教材 P90—P93", "title": "一国两制：前提与从属", "titlePre": "", "titlePost": "", "qprefix": "关键词", "keywords": ["港澳", "一国两制", "爱国者治港治澳"], "answer": ["“一国两制”是党领导人民实现祖国和平统一的一项重要制度，是中国特色社会主义的伟大创举。“一国”是实行“两制”的前提和基础，“两制”从属和派生于“一国”并统一于“一国”之内。全面准确贯彻“一国两制”、“港人治港”、“澳人治澳”、高度自治的方针，落实中央全面管治权、爱国者治港治澳，促进港澳长期繁荣稳定。"], "summary": "先有“一国”，才有“两制”。"}, {"t": "term", "bg": "b2", "x": 470, "w": 780, "dens": "L", "kicker": "第九课 · 教材 P93—P96", "title": "解决台湾问题：一个中国原则", "titlePre": "", "titlePost": "", "qprefix": "关键词", "keywords": ["两岸交流", "九二共识", "一个中国"], "answer": ["解决台湾问题、实现祖国完全统一，是党矢志不渝的历史任务。世界上只有一个中国，大陆和台湾同属一个中国。“和平统一、一国两制”是解决台湾问题的基本方针；一个中国原则是两岸关系的政治基础，坚持九二共识，坚定反“独”促统。"], "summary": "一个中国是政治基础，和平统一是基本方针。"}, {"t": "term", "bg": "b6", "x": 350, "w": 880, "dens": "L", "kicker": "第十课 · 教材 P99—P103", "title": "中国梦的本质与实现", "titlePre": "", "titlePost": "", "qprefix": "关键词", "keywords": ["民族复兴", "国家富强", "民族振兴", "人民幸福"], "answer": ["实现中华民族伟大复兴是近代以来中华民族最伟大的梦想。中国梦的本质是实现国家富强、民族振兴、人民幸福；中国梦是国家的梦、民族的梦，也是每个中国人的梦。实现中国梦必须坚持中国共产党的领导，必须走中国道路，必须弘扬中国精神，必须凝聚中国力量。"], "summary": "四必须：党的领导、中国道路、中国精神、中国力量。"}, {"t": "term", "bg": "b2", "x": 470, "w": 780, "dens": "L", "kicker": "第十课 · 教材 P104", "title": "新时代是奋斗者的时代", "titlePre": "", "titlePost": "", "qprefix": "关键词", "keywords": ["青年担当", "追梦人", "挺膺担当"], "answer": ["我们要彰显新时代中国人的自信品格，在中国式现代化建设中挺膺担当，与时代同进步，与祖国共成长。可以从四件事做起：坚定理想信念，练就过硬本领，参加社会实践与志愿服务，关注时政并理性表达，做新时代的追梦人。"], "summary": "与时代同进步，与祖国共成长。"}, {"t": "mind", "bg": "b4", "ghost": "32", "kicker": "检测 · 结构重建", "title": "全册知识框架", "tree": {"root": "九上道法", "units": [{"name": "党的领导", "nodes": ["百年奋斗", "初心使命", "领导一切", "建党精神"]}, {"name": "新时代", "nodes": ["历史方位", "思想旗帜", "中国腾飞", "主要矛盾"]}, {"name": "新征程", "nodes": ["宏伟蓝图", "高质量", "新理念", "新格局"]}, {"name": "中国梦", "nodes": ["团结伟力", "一国两制", "台湾问题", "四必须"]}]}, "notes": ["层级：单元—判断", "四字节点是锚点", "断掉那支最薄弱"]}, {"t": "judge", "ghost": "33", "kicker": "检测 · 易错点", "title": "易错点判断", "items": [{"s": "我国社会主要矛盾的变化，改变了我国社会主义所处历史阶段的判断。", "ans": false}, {"s": "改革开放是决定当代中国命运的关键一招。", "ans": true}, {"s": "党的领导是中国特色社会主义最本质的特征。", "ans": true}, {"s": "人民当家作主是我国的根本政治制度。", "ans": false}, {"s": "“一国两制”中，“两制”是实行“一国”的前提和基础。", "ans": false}, {"s": "高质量发展是全面建设社会主义现代化国家的首要任务。", "ans": true}]}, {"t": "match", "ghost": "34", "kicker": "检测 · 材料对应", "title": "材料关键词配对", "pairs": [{"l": "红船、中共一大、北大红楼", "r": "精神之源"}, { /* ===================== 渲染工具 ===================== */
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function darkShell(s, extra, ghost){
  return `<div class="dark"><div class="ghost">${ghost||''}</div>`+
         `<div class="inner">${extra}</div></div>`;
}

function renderSlide(s, i){
  const d = document.createElement('div');
  d.className = 'slide t-' + s.t;
  d.dataset.idx = i;

  if (s.t === 'cover'){
    d.innerHTML = `<div class="bg" style="background-image:url(${IMG[s.bg]})"></div>
      <div class="cover-veil"></div>
      <div class="cover-inner">
        <div class="kick">${esc(s.kicker)}</div>
        <h1 class="cover-tt">${esc(s.title)}</h1>
        <div class="cover-sub">${esc(s.lead)}</div>
        <div class="cover-sum">${esc(s.summary)}</div>
      </div>`;
  }
  else if (s.t === 'toc'){
    const rows = s.items.map(it=>`<button class="toc-row" data-goto="${it.page}">
        <span class="no">${esc(it.no)}</span><span class="nm">${esc(it.name)}</span>
        <span class="pg">P${it.page}</span></button>`).join('');
    d.innerHTML = darkShell(s,
      `<div class="kick">${esc(s.kicker)}</div>
       <h2 class="tt">${esc(s.title)}</h2>
       <div class="lead">${esc(s.lead)}</div>
       <div class="toc-grid">${rows}</div>`);
  }
  else if (s.t === 'section'){
    d.innerHTML = darkShell(s,
      `<div class="kick">${esc(s.kicker)}</div>
       <div class="sec-rule"></div>
       <h2 class="tt" style="font-size:64px">${esc(s.title)}</h2>
       <div class="lead">${esc(s.lead)}</div>`, s.ghost);
  }
  else if (s.t === 'term'){
    const kws = (s.keywords||[]).map(k=>`<span class="kw">${esc(k)}</span>`).join('');
    const ansHtml = (s.answer||[]).map(a=>`<li>${esc(a)}</li>`).join('');
    d.innerHTML = `<div class="bg" style="background-image:url(${IMG[s.bg]})"></div>
      <div class="term-col dens-${esc(s.dens||'M')}">
        <div class="veil"></div>
        <div class="face">
          <div class="kick">${esc(s.kicker)}</div>
          <h2 class="tt">${s.titlePre ? esc(s.titlePre)+'<br><em>'+esc(s.titlePost)+'</em>' : '<em>'+esc(s.title)+'</em>'}</h2>
          <div class="kwrow"><span class="qp">${esc(s.qprefix||'关键词')}</span>${kws}</div>
          <div class="card masked" data-card>
            <div class="seal">
              <div class="stamp">揭晓</div>
              <div class="hint">点按看术语 · 共 ${(s.answer||[]).length} 段</div>
            </div>
          </div>
          <div class="card" data-ans hidden>
            <ol class="ans">${ansHtml}</ol>
            ${s.summary?`<div class="sumline">${esc(s.summary)}</div>`:''}
          </div>
        </div>
      </div>`;
  }
  else if (s.t === 'mind'){
    const cols = s.tree.units.map(u=>`<div class="mm-col">
        <h4>${esc(u.name)}</h4>
        ${u.nodes.map(n=>`<button class="mm-node">${esc(n)}</button>`).join('')}
      </div>`).join('');
    d.innerHTML = darkShell(s,
      `<div class="kick">${esc(s.kicker)}</div>
       <h2 class="tt">${esc(s.title)}</h2>
       <div class="mm">
         <div class="mm-root">${esc(s.tree.root)}</div>
         <div class="mm-grid">${cols}</div>
         <div class="mm-notes">${(s.notes||[]).map(n=>`<span>${esc(n)}</span>`).join('')}</div>
       </div>`, s.ghost);
  }
  else if (s.t === 'judge'){
    const items = s.items.map((it,k)=>`<div class="jitem">
        <div class="jtext">${esc(it.s)}</div>
        <div class="jbtns" data-k="${k}">
          <button data-v="1">对</button><button data-v="0">错</button>
          <span class="jres"></span>
        </div>
      </div>`).join('');
    d.innerHTML = darkShell(s,
      `<div class="kick">${esc(s.kicker)}</div>
       <h2 class="tt">${esc(s.title)}</h2>
       <div class="jlist">${items}</div>`, s.ghost);
  }
  else if (s.t === 'match'){
    const rows = s.pairs.map((p,k)=>`<button class="mitem" data-side="l" data-k="${k}">${esc(p.l)}</button>`+
      `<div class="marrow"></div>`+
      `<button class="mitem" data-side="r" data-k="${s.order[k]}">${esc(s.pairs[s.order[k]].r)}</button>`).join('');
    d.innerHTML = darkShell(s,
      `<div class="kick">${esc(s.kicker)}</div>
       <h2 class="tt">${esc(s.title)}</h2>
       <div class="mgrid">${rows}</div>`, s.ghost);
  }
  else if (s.t === 'home'){
    const items = s.items.map(it=>`<div class="hwcard" style="border-color:${it.color}">
        <span class="tag" style="background:${it.color}">${esc(it.tag)}</span>
        <p>${esc(it.text)}</p></div>`).join('');
    d.innerHTML = darkShell(s,
      `<div class="kick">${esc(s.kicker)}</div>
       <h2 class="tt">${esc(s.title)}</h2>
       <div class="lead">${esc(s.lead)}</div>
       <div class="hw">${items}</div>
       <div class="lead" style="font-size:17px;margin-top:26px;color:#D9B98A">${esc(s.summary)}</div>`, s.ghost);
  }
  return d;
}

/* ===================== 构建 ===================== */
const stage = document.getElementById('stage');
const slides = [];
let cur = 0;

DATA.slides.forEach((s,i)=>{
  const el = renderSlide(s,i);
  stage.appendChild(el);
  slides.push(el);
});

/* 支持通过 #p=3 直达 */
const hashPage = (()=>{
  const m = location.hash.match(/p=(\d+)/);
  return m ? Math.min(Math.max(parseInt(m[1],10)-1,0), slides.length-1) : 0;
})();

function show(n, scrollTop){
  n = Math.min(Math.max(n,0), slides.length-1);
  const prevIdx = cur;
  cur = n;
  slides.forEach((el,i)=>el.classList.toggle('on', i===n));
  document.getElementById('pn').textContent = (n+1) + ' / ' + slides.length;
  document.getElementById('bar').firstElementChild.style.width = ((n+1)/slides.length*100)+'%';
  document.getElementById('ovgrid').querySelectorAll('.ovitem').forEach((b,i)=>b.classList.toggle('cur', i===n));
  try{ history.replaceState(null,'','#p='+(n+1)); }catch(e){}
  if (FLOW && scrollTop !== false && prevIdx !== n) window.scrollTo({top:0,behavior:'auto'});
}
function next(){ show(cur+1); }
function prev(){ show(cur-1); }

/* 术语卡揭晓 */
stage.addEventListener('click', e=>{
  const masked = e.target.closest('.card.masked');
  if (masked){
    const box = masked.parentElement;
    masked.hidden = true;
    const ans = box.querySelector('[data-ans]');
    if (ans){ ans.hidden = false; ans.scrollTop = 0; }
    return;
  }
  const tocRow = e.target.closest('.toc-row');
  if (tocRow){ show(parseInt(tocRow.dataset.goto,10)-1); return; }
  const node = e.target.closest('.mm-node');
  if (node){ node.classList.toggle('done'); return; }
  const jb = e.target.closest('.jbtns button');
  if (jb){
    const wrap = jb.parentElement;
    const k = parseInt(wrap.dataset.k,10);
    const pick = jb.dataset.v === '1';
    const right = (pick === !!DATA.slides[cur].items[k].ans);
    wrap.querySelectorAll('button').forEach(b=>b.classList.remove('ok','no'));
    jb.classList.add(right ? 'ok' : 'no');
    wrap.querySelector('.jres').textContent = right ? '✓ 判断正确' : '✗ 再想想';
    return;
  }
  const mi = e.target.closest('.mitem');
  if (mi){
    const grid = mi.parentElement;
    const sel = grid.querySelector('.mitem.sel');
    if (sel === mi){ mi.classList.remove('sel'); return; }
    if (!sel){ mi.classList.add('sel'); return; }
    if (sel.dataset.side === mi.dataset.side){ sel.classList.remove('sel'); mi.classList.add('sel'); return; }
    if (sel.dataset.k === mi.dataset.k){ sel.classList.add('matched'); mi.classList.add('matched'); }
    sel.classList.remove('sel');
    return;
  }
});

/* ===================== 模式：课件 / 阅读 ===================== */
const MQ = window.matchMedia('(max-width: 820px), (max-height: 480px)');
const html = document.documentElement;
let FLOW = MQ.matches;
let userMode = null;   // null=自动；true=强制阅读；false=强制课件

function setMode(flow, auto){
  FLOW = flow;
  html.classList.toggle('is-flow', flow);
  html.classList.toggle('is-deck', !flow);
  document.getElementById('modeBtn').textContent = flow ? '课件模式' : '阅读模式';
  document.getElementById('stage').style.transform = flow ? 'none' : '';
  if (!flow) fit();
  show(cur, false);
  if (flow) window.scrollTo(0,0);
}

function fit(){
  if (FLOW) return;
  const st = document.getElementById('stage');
  const HUD_PAD = 54;
  const s = Math.min(window.innerWidth/1280, (window.innerHeight-HUD_PAD)/720);
  st.style.transform = 'translateY(' + (-HUD_PAD/2) + 'px) scale(' + s + ')';
}

function applyAuto(){
  if (userMode === null) setMode(MQ.matches, true);
}

MQ.addEventListener ? MQ.addEventListener('change', ()=>{ if(userMode===null) applyAuto(); })
                    : MQ.addListener(()=>{ if(userMode===null) applyAuto(); });

document.getElementById('modeBtn').onclick = ()=>{
  userMode = !FLOW;         // 手动切换后记住，刷新前不再自动
  setMode(userMode, false);
  try{ localStorage.setItem('dk-mode', userMode ? 'flow' : 'deck'); }catch(e){}
};
try{
  const saved = localStorage.getItem('dk-mode');
  if (saved) userMode = (saved === 'flow');
}catch(e){}

/* ===================== 导航与交互 ===================== */
const overlay = document.getElementById('overlay');
function toggleToc(){
  overlay.classList.toggle('on');
  if (overlay.classList.contains('on')) document.getElementById('ovclose').focus();
}
document.getElementById('ovclose').onclick = ()=> overlay.classList.remove('on');
overlay.addEventListener('click', e=>{ if (e.target === overlay) overlay.classList.remove('on'); });
document.getElementById('tocBtn').onclick = toggleToc;
document.getElementById('prev').onclick = prev;
document.getElementById('next').onclick = next;

/* 目录浮层内容 */
const ovgrid = document.getElementById('ovgrid');
ovgrid.innerHTML = DATA.slides.map((s,i)=>{
  const label = (s.kicker? s.kicker+' · ' : '') + (s.title||'');
  return `<button class="ovitem" data-goto="${i}"><span class="n">${String(i+1).padStart(2,'0')}</span><span>${esc(label)}</span></button>`;
}).join('');
ovgrid.addEventListener('click', e=>{
  const b = e.target.closest('.ovitem');
  if (!b) return;
  show(parseInt(b.dataset.goto,10));
  overlay.classList.remove('on');
});

function toggleFs(){
  try{
    const el = document.documentElement;
    if (!document.fullscreenElement && !document.webkitFullscreenElement){
      const fn = el.requestFullscreen || el.webkitRequestFullscreen;
      if (fn){ const p = fn.call(el); if (p && p.catch) p.catch(()=>{}); }
    } else {
      const fn = document.exitFullscreen || document.webkitExitFullscreen;
      if (fn){ const p = fn.call(document); if (p && p.catch) p.catch(()=>{}); }
    }
  }catch(e){}
}
document.getElementById('fsBtn').onclick = toggleFs;

/* 键盘 */
document.addEventListener('keydown', e=>{
  const k = e.key;
  if (k === 'Escape'){ overlay.classList.remove('on'); return; }
  if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || k === ' ' || k === 'Enter'){
    if (e.target.tagName === 'BUTTON' && k === ' ') return;
    e.preventDefault(); next();
  } else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp'){
    e.preventDefault(); prev();
  } else if (k === 'Home'){ e.preventDefault(); show(0); }
  else if (k === 'End'){ e.preventDefault(); show(slides.length-1); }
  else if (k === 't' || k === 'T'){ toggleToc(); }
  else if (k === 'm' || k === 'M'){ userMode = !FLOW; setMode(userMode,false); }
  else if (k === 'f' || k === 'F'){ toggleFs(); }
});

/* 滚轮翻页（仅课件模式） */
let wheelLock = 0;
window.addEventListener('wheel', e=>{
  if (FLOW) return;
  const now = Date.now();
  if (now - wheelLock < 620) return;
  if (Math.abs(e.deltaY) < 12) return;
  wheelLock = now;
  if (e.deltaY > 0) next(); else prev();
}, {passive:true});

/* 触摸滑动（仅课件模式；阅读模式用原生滚动） */
let tx = 0, ty = 0;
window.addEventListener('touchstart', e=>{ tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
window.addEventListener('touchend', e=>{
  if (FLOW) return;
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 54 && Math.abs(dx) > Math.abs(dy)){ dx < 0 ? next() : prev(); }
}, {passive:true});

/* 尺寸变化 */
window.addEventListener('resize', ()=>{ if (!FLOW) fit(); else window.scrollTo(0, window.scrollY); });
window.addEventListener('orientationchange', ()=>{ setTimeout(()=>{ if(!FLOW) fit(); }, 260); });

/* 启动 */
if (userMode !== null) setMode(userMode, false);
else applyAuto();
show(hashPage);
if (!FLOW) fit();
</script>
</body>
</html>
