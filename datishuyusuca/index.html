<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>九上道法 · 关键词与答题术语速查</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#141110}
body{
  font-family:"Songti SC","STSong","SimSun","Noto Serif CJK SC","Source Han Serif SC",serif;
  -webkit-font-smoothing:antialiased;color:#241C14;
  background:radial-gradient(120% 120% at 50% 0%,#221D19 0%,#141110 70%);
}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}

/* ── 舞台 ─────────────────────────────── */
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;
  margin:-360px 0 0 -640px;transform-origin:center center;
  background:#1F2A29;overflow:hidden;
  box-shadow:0 34px 90px rgba(0,0,0,.72),0 0 0 1px rgba(255,255,255,.05)}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;
  transition:opacity .34s ease;overflow:hidden}
.slide.on{opacity:1;visibility:visible}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat}
.bg::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(20,17,16,.10) 0%,rgba(20,17,16,0) 26%,rgba(20,17,16,0) 74%,rgba(20,17,16,.14) 100%)}

/* ── 术语页 ───────────────────────────── */
.term-col{position:absolute;top:0;bottom:0;padding:46px 26px 20px;z-index:2}
/* 遮罩铺满整页，渐变中心对准文字列，边缘自然淡出（不再切出硬边） */
.veil{position:absolute;inset:0;z-index:1;pointer-events:none}
.face{position:relative;z-index:1;display:flex;flex-direction:column;height:100%}
.kick{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;
  color:#8C2F1F;letter-spacing:.05em}
.kick::before{content:"";width:26px;height:2px;background:#8C2F1F;flex:0 0 auto}
.tt{font-size:40px;line-height:1.28;font-weight:800;color:#241C14;
  margin-top:13px;letter-spacing:-.005em;text-wrap:balance}
.q{margin-top:15px;display:flex;gap:9px;align-items:flex-start;
  background:rgba(255,255,255,.62);border-left:3px solid #8C2F1F;
  padding:10px 14px 8px;border-radius:0 2px 2px 0}
.q b{flex:0 0 auto;font-size:20px;font-weight:800;color:#8C2F1F;letter-spacing:.04em;padding-top:2px}
.kws{display:flex;flex-wrap:wrap;gap:5px 0;flex:1 1 auto;min-width:0}
.kw{display:inline-block;font-size:20px;line-height:1.5;color:#4A2116;
  background:rgba(140,47,31,.085);border-radius:2px;padding:0 8px;margin:0 5px 3px 0}
.kw::after{content:""}

.card{position:relative;margin-top:auto;margin-bottom:0;flex:0 1 auto;min-height:110px;
  background:linear-gradient(178deg,#FFFDF6 0%,#F8F1E0 100%);
  border:1px solid rgba(140,47,31,.20);border-radius:3px;
  padding:24px 26px;overflow:auto;
  box-shadow:0 12px 28px rgba(58,36,16,.11),inset 0 1px 0 #fff;
  transition:transform .22s ease,box-shadow .22s ease}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,#8C2F1F,rgba(140,47,31,.22))}
.card .body{font-size:23px;line-height:1.86;color:#241C14;
  transition:opacity .3s ease,transform .3s ease}
.card[data-dens="M"]{padding:20px 22px}
.card[data-dens="M"] .body{font-size:22px;line-height:1.78}
.card[data-dens="S"]{padding:18px 20px}
.card[data-dens="S"] .body{font-size:21px;line-height:1.70}
.card .body p{margin:0 0 9px}
.card .body p:last-child{margin-bottom:0}
.card.masked{cursor:pointer}
.card.masked:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(58,36,16,.16),inset 0 1px 0 #fff}
.card.masked .body{visibility:hidden}
.card.revealed .body{animation:rise .34s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.seal{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:13px;border-radius:3px;transition:opacity .26s ease;
  background:repeating-linear-gradient(45deg,rgba(140,47,31,.032) 0 9px,transparent 9px 18px)}
.seal .stamp{width:94px;height:94px;border:3px solid #8C2F1F;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  writing-mode:vertical-rl;font-size:28px;font-weight:700;color:#8C2F1F;
  letter-spacing:.12em;opacity:.9}
.seal .hint{font-size:16px;color:#8C2F1F;letter-spacing:.1em;opacity:.75}
.seal.gone{opacity:0;pointer-events:none}
.sum{margin-top:15px;border-left:3px solid #8C2F1F;padding:1px 0 1px 12px;
  font-size:21px;line-height:1.6;font-weight:700;color:#5A2114}

/* ── 深色结构页 ───────────────────────── */
.dark{position:absolute;inset:0;background:#1F2A29;color:#F3E9D6}
.dark::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(90% 70% at 78% 16%,rgba(140,47,31,.26) 0%,transparent 62%),
             radial-gradient(70% 60% at 8% 96%,rgba(47,93,98,.30) 0%,transparent 60%)}
.dark .inner{position:relative;z-index:2;height:100%;padding:0 86px;
  display:flex;flex-direction:column;justify-content:center}
.ghost{position:absolute;right:64px;bottom:-38px;font-size:268px;line-height:.8;
  font-weight:800;color:rgba(243,233,214,.055);z-index:1;letter-spacing:-.04em;
  font-family:"Helvetica Neue",Arial,sans-serif}
.dark .kick{color:#D9B98A}
.dark .kick::before{background:#8C2F1F}
.dark .tt{color:#F7F0E1;font-size:58px;margin-top:16px}
.dark .lead{margin-top:20px;font-size:23px;line-height:1.8;color:#C9BFAE;max-width:900px}
.rule{width:52px;height:3px;background:#8C2F1F;margin-top:26px}

/* 封面：宣纸提亮 + 深墨题字 */
.cover-veil{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(118% 104% at 20% 32%,
    rgba(250,245,233,.965) 0%,rgba(250,245,233,.92) 34%,
    rgba(250,245,233,.62) 58%,rgba(250,245,233,.20) 82%,rgba(250,245,233,0) 100%)}
.cover-inner{position:absolute;inset:0;z-index:2;padding:0 96px;
  display:flex;flex-direction:column;justify-content:center;max-width:1010px}
.cover-inner .kick{color:#8C2F1F;font-size:21px}
.cover-tt{font-size:68px;line-height:1.24;font-weight:800;color:#1E1811;
  letter-spacing:-.012em;margin-top:20px}
.cover-sub{margin-top:24px;font-size:23px;color:#5C4A35;letter-spacing:.05em}
.cover-sum{margin-top:34px;display:flex;align-items:center;gap:14px;
  font-size:24px;font-weight:700;color:#8C2F1F}
.cover-sum::before{content:"";width:40px;height:2px;background:#8C2F1F}

/* 目录 */
.toc-list{margin-top:34px;display:flex;flex-direction:column}
.toc-row{display:flex;align-items:baseline;gap:20px;padding:15px 6px;
  border-bottom:1px solid rgba(243,233,214,.11);transition:all .2s ease;cursor:pointer;
  text-align:left;width:100%}
.toc-row:hover{background:rgba(243,233,214,.06);padding-left:16px}
.toc-row .no{font-size:15px;color:#8C2F1F;letter-spacing:.12em;flex:0 0 34px;font-weight:700}
.toc-row .nm{font-size:27px;color:#F0E7D6;flex:1}
.toc-row .pg{font-size:18px;color:#8F8676;letter-spacing:.05em}
.toc-row:hover .nm{color:#fff}

/* ── 思维导图 ─────────────────────────── */
.mm-wash{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(250,245,233,.86) 0%,rgba(250,245,233,.70) 46%,rgba(250,245,233,.60) 100%)}
.mm-head{position:absolute;left:44px;top:34px;z-index:2}
.mm-title{font-size:41px;font-weight:800;color:#1E1811;margin-top:9px;letter-spacing:-.005em}
.mm-wrap{position:absolute;left:36px;top:146px;width:1208px;height:474px;z-index:2;
  background:rgba(251,246,235,.955);border:1px solid rgba(140,47,31,.16);border-radius:4px;
  box-shadow:0 16px 40px rgba(58,36,16,.16)}
.mm-lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.mm-lines path{fill:none;stroke:rgba(140,47,31,.32);stroke-width:2}
.mm-lines path.trunk{stroke:rgba(140,47,31,.55)}
.mm-root{position:absolute;left:506px;top:12px;width:196px;height:66px;z-index:3;
  background:#8C2F1F;color:#FFF6E6;border-radius:3px;display:flex;align-items:center;
  justify-content:center;font-size:26px;font-weight:700;letter-spacing:.1em;
  box-shadow:0 8px 20px rgba(140,47,31,.32)}
.mm-col{position:absolute;top:112px;width:275px;z-index:3}
.mm-unit{height:52px;background:#2F5D62;color:#EFF5F4;border-radius:3px;
  display:flex;align-items:center;justify-content:center;font-size:23px;
  font-weight:700;letter-spacing:.14em;box-shadow:0 6px 16px rgba(47,93,98,.28)}
.mm-nodes{margin-top:12px;display:flex;flex-direction:column;gap:12px}
.mm-node{height:58px;background:#FFFDF7;border:1px solid rgba(31,42,41,.16);border-radius:3px;
  display:flex;align-items:center;justify-content:center;font-size:23px;color:#241C14;
  letter-spacing:.1em;cursor:pointer;transition:all .18s ease;position:relative;user-select:none}
.mm-node:hover{transform:translateY(-2px);border-color:rgba(140,47,31,.5);
  box-shadow:0 6px 16px rgba(58,36,16,.13)}
.mm-node.done{background:#F2E7CE;border-color:rgba(140,47,31,.42);color:#6B3A26}
.mm-node.done::after{content:"✓";position:absolute;right:9px;top:1px;font-size:14px;color:#8C2F1F}
.mm-note{position:absolute;left:36px;bottom:8px;width:1208px;display:flex;
  justify-content:center;gap:34px;font-size:18px;color:#5E5548;letter-spacing:.04em;z-index:2}
.mm-note span::before{content:"·";margin-right:8px;color:#8C2F1F}
.mm-note span:first-child::before{content:"";margin:0}

/* ── 判断题 ───────────────────────────── */
.jlist{margin-top:26px;display:flex;flex-direction:column;gap:11px}
.jrow{display:flex;align-items:center;gap:16px;background:rgba(249,243,230,.965);
  border:1px solid rgba(140,47,31,.14);border-radius:3px;padding:13px 18px;
  transition:all .24s ease}
.jrow .jno{flex:0 0 30px;font-size:14px;font-weight:700;color:#8C2F1F;letter-spacing:.08em}
.jrow .jt{flex:1;font-size:20px;line-height:1.55;color:#241C14}
.jbtns{display:flex;gap:8px;flex:0 0 auto}
.jbtns button{width:56px;height:34px;border:1px solid rgba(31,42,41,.28);border-radius:2px;
  font-size:18px;color:#3A2C1C;transition:all .18s ease;background:rgba(255,255,255,.6)}
.jbtns button:hover{border-color:#8C2F1F;color:#8C2F1F}
.jrow.ok{background:rgba(240,232,210,.98);border-color:rgba(140,47,31,.5)}
.jrow.ng{background:rgba(233,226,214,.98);border-color:rgba(47,93,98,.55)}
.jrow.ok .jbtns button.picked{background:#8C2F1F;border-color:#8C2F1F;color:#FFF6E6}
.jrow.ng .jbtns button.picked{background:#2F5D62;border-color:#2F5D62;color:#F0F5F4}
.jrow .tip{flex:0 0 auto;font-size:16px;color:#6B5A44;letter-spacing:.03em;min-width:0}
.jrow .tip b{color:#8C2F1F;font-weight:700}
.jfoot{margin-top:20px;display:flex;align-items:center;gap:18px}
.jscore{font-size:20px;color:#F0E7D6;letter-spacing:.04em}
.jscore b{font-size:26px;color:#D9B98A;margin:0 3px}
.jreset{border:1px solid rgba(243,233,214,.34);border-radius:2px;padding:7px 18px;
  font-size:17px;color:#C9BFAE;letter-spacing:.06em;transition:all .18s}
.jreset:hover{border-color:#D9B98A;color:#D9B98A}

/* ── 配对题 ───────────────────────────── */
.mgrid{margin-top:24px;display:grid;grid-template-columns:1fr 44px 1fr;gap:12px 0;
  align-items:start}
.mcol{display:flex;flex-direction:column;gap:10px}
.mitem{position:relative;display:flex;align-items:center;gap:12px;min-height:56px;
  background:rgba(249,243,230,.965);border:1px solid rgba(140,47,31,.14);
  border-radius:3px;padding:10px 14px;font-size:19px;line-height:1.45;color:#241C14;
  transition:all .18s ease;text-align:left}
.mitem:hover{border-color:rgba(140,47,31,.5);background:#FFFDF6}
.mitem.sel{border-color:#8C2F1F;background:#FFF6E6;box-shadow:0 0 0 2px rgba(140,47,31,.18)}
.mitem.locked{cursor:default;background:#F5EDDB}
.mitem .dot{flex:0 0 22px;height:22px;border-radius:50%;border:1px dashed rgba(31,42,41,.3);
  display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;
  font-weight:700;font-family:Arial,sans-serif}
.mitem.matched .dot{border-style:solid}
.mitem.bad{border-color:#2F5D62;background:#E9EFEE}
.mitem.bad .dot{background:#2F5D62;border-color:#2F5D62}
.mid{display:flex;align-items:center;justify-content:center;color:rgba(243,233,214,.3);
  font-size:16px;padding-top:18px}
.mfoot{margin-top:18px;display:flex;align-items:center;gap:18px}

/* ── 作业页 ───────────────────────────── */
.hw{margin-top:34px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.hwcard{background:linear-gradient(178deg,#FFFDF6,#F8F1E0);border:1px solid rgba(140,47,31,.18);
  border-radius:3px;padding:26px 24px;position:relative;overflow:hidden;
  box-shadow:0 12px 28px rgba(58,36,16,.12)}
.hwcard::before{content:"";position:absolute;left:0;top:0;width:100%;height:4px;background:var(--c,#8C2F1F)}
.hwcard .tag{font-size:15px;font-weight:700;letter-spacing:.16em;color:var(--c,#8C2F1F);
  line-height:1.35}
.hwcard .hwt{margin-top:12px;font-size:22px;line-height:1.72;color:#241C14}
.hwcard .num{position:absolute;right:14px;bottom:2px;font-size:76px;font-weight:800;
  color:rgba(140,47,31,.07);font-family:"Helvetica Neue",Arial,sans-serif;line-height:1}

/* ── HUD ──────────────────────────────── */
#hud{position:fixed;inset:0;pointer-events:none;z-index:50}
#bar{position:absolute;left:0;top:0;width:100%;height:2px;background:rgba(255,255,255,.09)}
#bar i{display:block;height:100%;width:0;background:#8C2F1F;transition:width .3s ease;
  box-shadow:0 0 12px rgba(140,47,31,.8)}
#nav{position:absolute;left:50%;bottom:11px;transform:translateX(-50%);
  display:flex;align-items:center;gap:4px;pointer-events:auto;
  background:rgba(20,17,16,.6);border:1px solid rgba(255,255,255,.1);
  border-radius:999px;padding:4px 6px;backdrop-filter:blur(12px);opacity:.55;
  transition:opacity .25s ease}
#nav:hover{opacity:1}
#nav button{width:30px;height:26px;border-radius:999px;color:#E6DCC9;font-size:17px;
  line-height:1;transition:background .15s}
#nav button:hover{background:rgba(255,255,255,.12)}
#pn{font-size:12px;color:#C9BFAE;letter-spacing:.1em;padding:0 8px;font-variant-numeric:tabular-nums;
  font-family:"Helvetica Neue",Arial,sans-serif;min-width:66px;text-align:center}
#tools{position:absolute;right:22px;bottom:11px;display:flex;gap:8px;pointer-events:auto;
  opacity:.5;transition:opacity .25s ease}
#tools:hover{opacity:1}
#tools button{border:1px solid rgba(255,255,255,.14);border-radius:2px;padding:6px 12px;
  font-size:12px;color:#D6CBB6;letter-spacing:.1em;background:rgba(20,17,16,.6);
  backdrop-filter:blur(12px);transition:all .16s}
#tools button:hover{border-color:#8C2F1F;color:#E9DCC4}
#hint{position:absolute;left:24px;bottom:15px;font-size:12px;color:rgba(230,220,201,.32);
  letter-spacing:.1em}

/* 目录浮层 */
#overlay{position:fixed;inset:0;z-index:60;background:rgba(14,12,11,.9);
  backdrop-filter:blur(6px);display:none;padding:6vh 8vw;overflow:auto}
#overlay.on{display:block}
#overlay h3{color:#D9B98A;font-size:20px;letter-spacing:.2em;font-weight:700;margin-bottom:26px}
#ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px 26px}
#ovgrid button{display:flex;gap:12px;align-items:baseline;padding:9px 8px;text-align:left;
  border-bottom:1px solid rgba(255,255,255,.07);transition:all .16s}
#ovgrid button:hover{background:rgba(255,255,255,.06);padding-left:14px}
#ovgrid .n{font-size:11px;color:#8C2F1F;flex:0 0 24px;font-family:Arial,sans-serif;letter-spacing:.05em}
#ovgrid .t{font-size:15px;color:#DCD2BE;line-height:1.4}
#ovgrid button.cur .t{color:#D9B98A;font-weight:700}
#ovclose{position:absolute;right:8vw;top:5vh;color:#B8AD99;font-size:13px;letter-spacing:.14em;
  border:1px solid rgba(255,255,255,.16);border-radius:2px;padding:6px 14px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* 打印：每页一张，术语全部展开 */
@media print{
  @page{size:1280px 720px;margin:0}
  html,body{overflow:visible;height:auto;background:#fff}
  #hud,#overlay,#hint{display:none!important}
  #stage{position:static;margin:0;transform:none!important;box-shadow:none;width:1280px;height:auto;overflow:visible}
  .slide{position:relative;opacity:1!important;visibility:visible!important;
    width:1280px;height:720px;overflow:hidden;break-after:page;page-break-after:always}
  .card .body{visibility:visible!important;opacity:1!important}
  .seal{display:none!important}
  .mm-node,.hwcard{box-shadow:none}
}
noscript{display:block;padding:40px;color:#E6DCC9;font-size:16px;line-height:1.9}
</style>
</head>
<body>
<div id="stage"></div>
<noscript>这份课件需要 JavaScript 才能翻页，请在浏览器中启用后重新打开。</noscript>

<div id="hud">
  <div id="bar"><i></i></div>
  <div id="nav"><button id="prev" aria-label="上一页">‹</button><span id="pn">1 / 35</span><button id="next" aria-label="下一页">›</button></div>
  <div id="tools"><button id="tocBtn">目录 T</button><button id="fsBtn">全屏 F</button></div>
  <div id="hint">空格 揭晓或翻页 · ← → 翻页 · T 目录 · F 全屏</div>
</div>

<div id="overlay">
  <button id="ovclose">关闭 ESC</button>
  <h3>全册目录</h3>
  <div id="ovgrid"></div>
</div>

<script>
const DATA = {"title":"九上道法 · 关键词与答题术语速查","slides":[{"t":"cover","bg":"b1","kicker":"九年级上册 · 道德与法治","title":"关键词与答题术语速查","lead":"全册四单元 · 49 组术语 · 2026 秋新教材","summary":"看到关键词，就该想起那段术语。"},{"t":"toc","ghost":"","kicker":"CONTENTS · 全册导航","title":"本册导航","lead":"四单元一条主线：从党的领导走到中国梦。每页先给关键词与页码，术语盖住先猜。","items":[{"no":"01","name":"第一单元　坚持党的全面领导","page":3},{"no":"02","name":"第二单元　进入新时代","page":9},{"no":"03","name":"第三单元　奋进新征程","page":21},{"no":"04","name":"第四单元　共圆中国梦","page":26},{"no":"05","name":"检测与框架建构","page":32}]},{"t":"section","ghost":"01","kicker":"第一单元","title":"坚持党的全面领导","lead":"第一课—第三课 · 术语 1—9 · 党为什么能、党怎么领导"},{"t":"term","bg":"b4","x":650,"w":600,"dens":"L","kicker":"第一课 · 教材 P2—P6","title":"四个历史时期，一条复兴主线","titlePre":"","titlePost":"","qprefix":"关键词","keywords":["中共一大","北大红楼","红船","百年成就展"],"answer":["①新民主主义革命时期：浴血奋战、百折不挠，创造根本社会条件，中国人民从此站起来了。","②社会主义革命和建设时期：自力更生、发愤图强，奠定根本政治前提和制度基础。","③改革开放新时期：解放思想、锐意进取，提供体制保证和物质条件。","④新时代：自信自强、守正创新，提供更完善的制度保证、更主动的精神力量。"],"summary":"四个时期一条主线：为中华民族伟大复兴接续奋斗。"},{"t":"term","bg":"b1","x":320,"w":680,"dens":"L","kicker":"第一课 · 教材 P5","title":"关键一招：改革开放","titlePre":"","titlePost":"","qprefix":"关键词","keywords":["经济特区","十一届三中全会","强国之路"],"answer":["坚持改革开放，是我们的强国之路；改革开放是当代中国最鲜明的特色；改革开放是党和人民大踏步赶上时代的重要法宝，是决定当代中国命运的关键一招，也是决定实现“两个一百年”奋斗目标、实现中华民族伟大复兴的关键一招。它推动社会主义制度自我完善发展，解放和发展社会生产力，改善人民生活，提升我国国际地位。"],"summary":"强国之路、最鲜明特色、重要法宝——三个判断一起记。"},{"t":"term","bg":"b4","x":650,"w":600,"dens":"L","kicker":"第一课 · 教材 P7—P11","title":"精神之源：伟大建党精神","titlePre":"","titlePost":"","qprefix":"关键词","keywords":["建党精神","红船精神","两弹一星精神","抗疫精神"],"answer":["伟大建党精神的内涵是：坚持真理、坚守理想，践行初心、担当使命，不怕牺牲、英勇斗争，对党忠诚、不负人民。它是中国共产党的精神之源；以它为源头的中国共产党人精神谱系，跨越时空、历久弥新，成为激励全党全国各族人民攻坚克难、奋勇前行的强大精神动力。我们要弘扬光荣传统、赓续红色血脉，把伟大建党精神继承下去、发扬光大。"],"summary":"32 字建党精神，是整条精神谱系的源头。"},{"t":"term","bg":"b3","x":688,"w":556,"dens":"S","kicker":"第二课 · 教材 P14—P19","title":"以人民为中心：初心、性质、立场","titlePre":"以人民为中心：","titlePost":"初心、性质、立场","qprefix":"关键词","keywords":["为民办实事","民生实事","初心使命语录","群众路线"],"answer":["①初心使命：为中国人民谋幸福，为中华民族谋复兴，是激励一代代中国共产党人前赴后继、英勇奋斗的根本动力。","②党的性质：中国共产党是中国工人阶级的先锋队，同时是中国人民和中华民族的先锋队，是中国特色社会主义事业的领导核心。","③根本宗旨是全心全意为人民服务；人民立场是党的根本政治立场。"],"summary":"初心讲出发，性质讲是谁，立场讲依靠谁。"},{"t":"term","bg":"b1","x":320,"w":680,"dens":"M","kicker":"第三课 · 教材 P21—P26","title":"党是领导一切的","titlePre":"","titlePost":"","qprefix":"关键词","keywords":["定海神针","总揽全局","党政军民学","两个维护"],"answer":["①中国共产党是中国特色社会主义事业的坚强领导核心。","②党的领导是中国特色社会主义最本质的特征，是制度的最大优势，是实现社会主义现代化和民族复兴的最根本保证。","③党政军民学，东西南北中，党是领导一切的；办好中国的事情，关键在党。","④坚持党对一切工作的领导，是党和国家的根本所在、命脉所在，是全国各族人民的利益所在、幸福所在。","⑤党的领导是全面的、系统的、整体的，最重要的是坚决维护党中央权威和集中统一领导。"],"summary":"没有中国共产党，就没有新中国，就没有中华民族伟大复兴。"},{"t":"section","ghost":"02","kicker":"第二单元","title":"进入新时代","lead":"第四课—第六课 · 术语 10—38 · 新方位、新思想、新成就"},{"t":"term","bg":"b4","x":650,"w":600,"dens":"L","kicker":"第四课 · 教材 P30—P33","title":"变了什么，没变什么","titlePre":"","titlePost":"","qprefix":"关键词","keywords":["发展不平衡","城乡差距","是否已是发达国家","是否跨越初级阶段"],"answer":["变的是主要矛盾：我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾，这是中国特色社会主义进入新时代的基本依据。没变的是历史阶段：我国仍处于并将长期处于社会主义初级阶段的基本国情没有变，我国是世界最大发展中国家的国际地位没有变。要牢牢把握社会主义初级阶段这个最大实际，贯彻党的基本路线。"],"summary":"主要矛盾之变，不改初级阶段之实。"},{"t":"term","bg":"b1","x":320,"w":680,"dens":"L","kicker":"第四课 · 教材 P34—P36","title":"新时代的三个意味着","titlePre":"","titlePost":"","qprefix":"关键词","keywords":["新的历史方位","三个意味着"],"answer":["进入新时代是我国发展新的历史方位。","①意味着中华民族迎来从站起来、富起来到强起来的伟大飞跃。","②意味着科学社会主义在二十一世纪的中国焕发出强大生机活力。","③意味着中国特色社会主义道路、理论、制度、文化不断发展，拓展发展中国家走向现代化的途径，贡献中国智慧和中国方案。"],"summary":"民族、社会主义、现代化道路，三个“意味着”三个层面。"},{"t":"term","bg":"b3","x":688,"w":556,"dens":"L","kicker":"第五课 · 教材 P38—P42","title":"新时代的思想旗帜","titlePre":"","titlePost":"","qprefix":"关键词","keywords":["十个明确","十四个坚持","十三个方面成就","六个必须坚持"],"answer":["习近平新时代中国特色社会主义思想，坚持“两个结合”，科学回答三大时代课题。“十个明确”“十四个坚持”“十三个方面成就”概括主要内容，“六个必须坚持”是世界观和方法论。四者内在贯通、有机统一，共同构成系统科学的理论体系，是当代中国马克思主义、二十一世纪马克思主义。"],"summary":"内容＋方略＋成就＋方法论，合成一个完整体系。"},{"t":"term","bg":"b1","x":320,"w":680,"dens":"L","kicker":"第五课 · 教材 P43—P45","title":"最根本的原因：两个确立","titlePre":"","titlePost":"","qprefix":"关键词","keywords":["两个确立","历史性成就","行动指南"],"answer":["新时代党和国家事业取得历史性成就，最根本的原因在于有习近平同志作为党中央的核心、全党的核心掌舵领航，在于有习近平新时代中国特色社会主义思想科学指引。这一思想是中华文化和中国精神的时代精华，是新时代中国共产党的思想旗帜，是全党全国人民为民族复兴奋斗的行动指南。"],"summary":"旗帜、指南、根本遵循——三个定位一句话。"},{"t":"term","bg":"b4","x":650,"w":600,"dens":"L","kicker":"第六课第一框 · 教材 P47—P48","title":"制度基础与经济总量","titlePre":"","titlePost":"","qprefix":"关键词","keywords":["三大基本经济制度","经济总量","制造业","货物贸易"],"answer":["社会主义基本经济制度包括：公有制为主体、多种所有制经济共同发展；按劳分配为主体、多种分配方式并存；社会主义市场经济体制。它既体现社会主义制度优越性，又同我国社会主义初级阶段社会生产力发展水平相适应，是党和人民的伟大创造。发展是党执政兴国的第一要务，是解决我国一切问题的基础和关键；新时代我国经济总量稳居世界第二位。"],"summary":"三条制度支柱，撑起“第一要务”。"},{"t":"term","bg":"b3","x":688,"w":556,"dens":"M","kicker":"第六课第一框 · 教材 P49","title":"创新与结构：从速度到质量","titlePre":"","titlePost":"","qprefix":"关键词","keywords":["人工智能","重大科技成果","产业升级","乡村振兴","京津冀","粤港澳"],"answer":["①创新活力不断激发，我国坚持实施创新驱动发展战略，已经进入创新型国家行列。","②经济结构不断优化，实施制造强国战略，产业向中高端迈进。","③推进新型城镇化与乡村振兴战略，缩小城乡发展差距，朝着共同富裕方向稳步前进。","④东中西部和东北地区“四大板块”联动发展，区域协调发展呈现新格局。"],"summary":"创新、结构、城乡区域，三条腿走路。"},{"t":"term","bg":"b1","x":320,"w":680,"dens":"M","kicker":"第六课第二框 · 教材 P50—P51","title":"全过程人民民主","titlePre":"","titlePost":"","qprefix":"关键词","keywords":["党的领导＋征求民意＋立法法治","开门立法","根本政治制度"],"answer":["①新时代以来，我们党坚定不移走中国特色社会主义政治发展道路，坚持党的领导、人民当家作主、依法治国有机统一，创造性提出全过程人民民主重大理念并大力推进。","②全过程人民民主是社会主义民主政治的本质属性，是最广泛、最真实、最管用的民主，是全链条、全方位、全覆盖的民主。","③人民当家作主制度体系不断完善，为发展全过程人民民主提供可靠制度保障。"],"summary":"本质属性、三个“最”、制度保障，三层一起答。"},{"t":"term","bg":"b4","x":650,"w":600,"dens":"S","kicker":"第六课第二框 · 教材 P52—P53","title":"协商、基层与法治","titlePre":"","titlePost":"","qprefix":"关键词","keywords":["民主选举","民主协商","村委会","立法司法"],"answer":["①公民依法行使民主权利，通过民主选举、民主协商、民主决策、民主管理、民主监督参与管理国家和社会事务。","②协商民主广泛深入发展：有事好商量，众人的事情由众人商量，是人民民主的真谛。","③基层民主活力增强，健全党组织领导的城乡基层治理体系。","④法治中国建设迈出坚实步伐；民主是法治的基础，法治是民主的保障，法治建设维护社会公平正义。"],"summary":"民主不是口号，选举、协商、基层、法治四条腿。"},{"t":"term","bg":"b3","x":688,"w":556,"dens":"L","kicker":"第六课第三框 · 教材 P54—P57","title":"文化自信：最基本、最深沉、最持久","titlePre":"文化自信：","titlePost":"最基本、最深沉、最持久","qprefix":"关键词","keywords":["意识形态","核心价值观","非遗文物","文艺创作"],"answer":["文化自信是更基础、更广泛、更深厚的自信，是最基本、最深沉、最持久的力量。确立马克思主义在意识形态领域指导地位的根本制度；把社会主义核心价值观作为凝魂聚气、强基固本的基础工程；推动中华优秀传统文化创造性转化、创新性发展；坚持以人民为中心的创作导向，文艺呈现百花齐放。"],"summary":"一个自信，四根支柱。"},{"t":"term","bg":"b6","x":350,"w":880,"dens":"L","kicker":"第六课第四框 · 教材 P57—P60","title":"民生福祉：发展的根本目的","titlePre":"","titlePost":"","qprefix":"关键词","keywords":["脱贫攻坚","教育公平","医保养老","扫黑除恶"],"answer":["①增进民生福祉是发展的根本目的，党把让老百姓过上好日子作为一切工作的出发点和落脚点，补齐民生保障短板，解决好人民群众急难愁盼问题。","②完成脱贫攻坚、全面建成小康社会的历史任务，历史性地解决了绝对贫困问题，创造人类减贫史上的奇迹。","③建成世界上规模最大的教育体系和社会保障体系。","④平安中国建设迈向更高水平，完善共建共治共享的社会治理制度。"],"summary":"脱贫、教育、社保、平安，民生四件大事。"},{"t":"term","bg":"b3","x":688,"w":556,"dens":"S","kicker":"第六课第五框 · 教材 P61—P63","title":"美丽中国：绿水青山就是金山银山","titlePre":"美丽中国：","titlePost":"绿水青山就是金山银山","qprefix":"关键词","keywords":["生态环境法典","蓝天碧水净土","垃圾分类","绿色生活"],"answer":["①保护自然就是保护人类，建设生态文明就是造福人类，坚持山水林田湖草沙一体治理。","②生态文明制度体系更加健全，协同推进降碳、减污、扩绿、增长。","③污染防治攻坚向纵深推进，坚持精准、科学、依法治污，城乡人居环境持续改善。","④绿色、循环、低碳发展迈出坚实步伐，简约适度的生活方式深入人心。"],"summary":"制度、治污、绿色生活：三步走到美丽中国。"},{"t":"section","ghost":"03","kicker":"第三单元","title":"奋进新征程","lead":"第七课—第八课 · 术语 39—43 · 蓝图与路径"},{"t":"term","bg":"b2","x":470,"w":780,"dens":"L","kicker":"第七课 · 教材 P70—P71","title":"蓝图：两步走","titlePre":"","titlePost":"","qprefix":"关键词","keywords":["2035","本世纪中叶","两步走"],"answer":["第一步，从 2020 年到 2035 年，基本实现社会主义现代化；第二步，从 2035 年到本世纪中叶，把我国建成富强民主文明和谐美丽的社会主义现代化强国。这一战略对动员全国各族人民万众一心为实现民族复兴团结奋斗具有重大意义。"],"summary":"十五年基本实现，再十五年建成强国。"},{"t":"term","bg":"b5","x":60,"w":680,"dens":"L","kicker":"第七课 · 教材 P72—P74","title":"中国式现代化的五个特色","titlePre":"","titlePost":"","qprefix":"关键词","keywords":["中国式现代化","五个中国特色"],"answer":["新时代新征程，党的中心任务是以中国式现代化全面推进中华民族伟大复兴。中国式现代化是中国共产党领导的社会主义现代化，具有五大特色：人口规模巨大、全体人民共同富裕、物质文明和精神文明相协调、人与自然和谐共生、走和平发展道路。实践证明，中国式现代化走得通、行得稳，是强国建设、民族复兴的唯一正确道路。"],"summary":"五个特色，一条道路，一个中心任务。"},{"t":"term","bg":"b2","x":470,"w":780,"dens":"L","kicker":"第八课 · 教材 P77—P78","title":"新发展理念：指挥棒与红绿灯","titlePre":"","titlePost":"","qprefix":"关键词","keywords":["创新","协调","绿色","开放","共享"],"answer":["理念是行动的先导。创新、协调、绿色、开放、共享是新发展理念，它是指挥棒、红绿灯。创新是第一动力，协调是内在要求，绿色是必要条件，开放是必由之路，共享是本质要求。"],"summary":"五个理念五个定位，一句话记全。"},{"t":"term","bg":"b5","x":60,"w":680,"dens":"L","kicker":"第八课 · 教材 P76 · P79—P82","title":"新发展格局与高质量发展","titlePre":"","titlePost":"","qprefix":"关键词","keywords":["双循环","新发展格局","新质生产力","科教兴国"],"answer":["①新发展格局是以国内大循环为主体、国内国际双循环相互促进的发展格局，最本质特征是实现高水平的自立自强。","②我国经济已由高速增长阶段转向高质量发展阶段，高质量发展是全面建设社会主义现代化国家的首要任务。必须发展新质生产力，坚持科技是第一生产力、人才是第一资源、创新是第一动力，深入实施科教兴国、人才强国、创新驱动发展战略。"],"summary":"格局保安全，质量定成败。"},{"t":"section","ghost":"04","kicker":"第四单元","title":"共圆中国梦","lead":"第九课—第十课 · 术语 44—49 · 团结、统一、复兴"},{"t":"term","bg":"b2","x":470,"w":780,"dens":"L","kicker":"第九课 · 教材 P87—P89","title":"铸牢中华民族共同体意识","titlePre":"","titlePost":"","qprefix":"关键词","keywords":["援疆援藏","石榴籽","四个与共"],"answer":["铸牢中华民族共同体意识是新时代党的民族工作的主线。要牢固树立休戚与共、荣辱与共、生死与共、命运与共的共同体理念，促进各民族共同团结奋斗、共同繁荣发展。青少年要尊重各民族风俗习惯，反对民族分裂言行。"],"summary":"一条主线，四个与共。"},{"t":"term","bg":"b3","x":688,"w":556,"dens":"L","kicker":"第九课 · 教材 P90—P93","title":"一国两制：前提与从属","titlePre":"","titlePost":"","qprefix":"关键词","keywords":["港澳","一国两制","爱国者治港治澳"],"answer":["“一国两制”是党领导人民实现祖国和平统一的一项重要制度，是中国特色社会主义的伟大创举。“一国”是实行“两制”的前提和基础，“两制”从属和派生于“一国”并统一于“一国”之内。全面准确贯彻“一国两制”、“港人治港”、“澳人治澳”、高度自治的方针，落实中央全面管治权、爱国者治港治澳，促进港澳长期繁荣稳定。"],"summary":"先有“一国”，才有“两制”。"},{"t":"term","bg":"b2","x":470,"w":780,"dens":"L","kicker":"第九课 · 教材 P93—P96","title":"解决台湾问题：一个中国原则","titlePre":"","titlePost":"","qprefix":"关键词","keywords":["两岸交流","九二共识","一个中国"],"answer":["解决台湾问题、实现祖国完全统一，是党矢志不渝的历史任务。世界上只有一个中国，大陆和台湾同属一个中国。“和平统一、一国两制”是解决台湾问题的基本方针；一个中国原则是两岸关系的政治基础，坚持九二共识，坚定反“独”促统。"],"summary":"一个中国是政治基础，和平统一是基本方针。"},{"t":"term","bg":"b6","x":350,"w":880,"dens":"L","kicker":"第十课 · 教材 P99—P103","title":"中国梦的本质与实现","titlePre":"","titlePost":"","qprefix":"关键词","keywords":["民族复兴","国家富强","民族振兴","人民幸福"],"answer":["实现中华民族伟大复兴是近代以来中华民族最伟大的梦想。中国梦的本质是实现国家富强、民族振兴、人民幸福；中国梦是国家的梦、民族的梦，也是每个中国人的梦。实现中国梦必须坚持中国共产党的领导，必须走中国道路，必须弘扬中国精神，必须凝聚中国力量。"],"summary":"四必须：党的领导、中国道路、中国精神、中国力量。"},{"t":"term","bg":"b2","x":470,"w":780,"dens" /* ── 舞台缩放 ─────────────────────────── */
const stage = document.getElementById('stage');
const HUD_PAD = 54;
function fit(){
  const s = Math.min(window.innerWidth/1280, (window.innerHeight-HUD_PAD)/720);
  stage.style.transform = 'translateY(' + (-HUD_PAD/2) + 'px) scale(' + s + ')';
}
window.addEventListener('resize', fit); fit();

/* ── 渲染 ─────────────────────────────── */
const esc = s => String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function darkShell(s, extra, ghost){
  return `<div class="dark"><div class="ghost">${ghost||''}</div>`+
         `<div class="inner">${extra}</div></div>`;
}

function renderSlide(s, i){
  const d = document.createElement('div');
  d.className = 'slide t-' + s.t;

  if (s.t === 'cover'){
    d.innerHTML = `<div class="bg" style="background-image:url(${IMG[s.bg]})"></div>
      <div class="cover-veil"></div>
      <div class="cover-inner">
        <div class="kick">${esc(s.kicker)}</div>
        <h1 class="cover-tt">${esc(s.title)}</h1>
        <div class="cover-sub">${esc(s.lead)}</div>
        <div class="cover-sum">${esc(s.summary)}</div>
      </div>`;
  }
  else if (s.t === 'toc'){
    const rows = s.items.map(it=>`<button class="toc-row" data-goto="${it.page}">
        <span class="no">${esc(it.no)}</span><span class="nm">${esc(it.name)}</span>
        <span class="pg">P${it.page}</span></button>`).join('');
    d.innerHTML = darkShell(s,
      `<div class="kick">${esc(s.kicker)}</div>
       <h2 class="tt" style="font-size:50px">${esc(s.title)}</h2>
       <div class="lead" style="font-size:20px;margin-top:14px">${esc(s.lead)}</div>
       <div class="toc-list">${rows}</div>`, s.ghost);
  }
  else if (s.t === 'section'){
    d.innerHTML = darkShell(s,
      `<div class="kick">${esc(s.kicker)}</div>
       <h2 class="tt">${esc(s.title)}</h2>
       <div class="lead">${esc(s.lead)}</div>
       <div class="rule"></div>`, s.ghost);
  }
  else if (s.t === 'term'){
    const kws = (s.keywords||[]).map(k=>`<span class="kw">${esc(k)}</span>`).join('');
    const body = (s.answer||[]).map(p=>`<p>${esc(p)}</p>`).join('');
    // 遮罩：以文字列中心为圆心，让列边缘落在半径 30% 处，向外自然淡出
    const vcx = ((s.x + s.w / 2) / 1280 * 100).toFixed(1);
    const vrx = ((s.w / 2 / 0.30) / 1280 * 100).toFixed(1);
    const veilBg = 'radial-gradient(' + vrx + '% 96% at ' + vcx + '% 50%,' +
      'rgba(249,243,230,.972) 0%,rgba(249,243,230,.962) 30%,' +
      'rgba(249,243,230,.93) 40%,rgba(249,243,230,.80) 50%,' +
      'rgba(249,243,230,.55) 58%,rgba(249,243,230,.28) 70%,' +
      'rgba(249,243,230,.08) 84%,rgba(249,243,230,0) 96%)';
    d.innerHTML = `<div class="bg" style="background-image:url(${IMG[s.bg]})"></div>
      <div class="veil" style="background-image:${veilBg}"></div>
      <div class="term-col" style="left:${s.x}px;width:${s.w}px">
        <div class="face">
          <div class="kick">${esc(s.kicker)}</div>
          <h2 class="tt">${s.titlePre ? esc(s.titlePre)+'<br>'+esc(s.titlePost) : esc(s.title)}</h2>
          <div class="q"><b>${esc(s.qprefix||'关键词')}</b><div class="kws">${kws}</div></div>
          <div class="card masked" data-dens="${s.dens||'M'}">
            <div class="body">${body}</div>
            <div class="seal"><div class="stamp">揭晓</div><div class="hint">点击看术语 · 共 ${s.answer.length} 段</div></div>
          </div>
          <div class="sum">${esc(s.summary)}</div>
        </div>
      </div>`;
  }
  else if (s.t === 'mind'){
    const STEP = 287, COLW = 275, LEFT = 36;
    const colHtml = s.tree.units.map((u,ui)=>
      `<div class="mm-col" style="left:${LEFT+ui*STEP}px">
         <div class="mm-unit">${esc(u.name)}</div>
         <div class="mm-nodes">${u.nodes.map(n=>`<div class="mm-node">${esc(n)}</div>`).join('')}</div>
       </div>`).join('');
    const xs = s.tree.units.map((u,ui)=>LEFT+ui*STEP+COLW/2);
    d.innerHTML = `<div class="bg" style="background-image:url(${IMG[s.bg]})"></div>
      <div class="mm-wash"></div>
      <div class="mm-head">
        <div class="kick">${esc(s.kicker)}</div>
        <h2 class="mm-title">${esc(s.title)}</h2>
      </div>
      <div class="mm-wrap">
        <svg class="mm-lines" viewBox="0 0 1208 474" preserveAspectRatio="none"></svg>
        <div class="mm-root">${esc(s.tree.root)}</div>
        ${colHtml}
      </div>
      <div class="mm-note">${s.notes.map(n=>`<span>${esc(n)}</span>`).join('')}</div>`;
    const svg = d.querySelector('.mm-lines');
    svg.innerHTML =
      `<path class="trunk" d="M604 78 V90"/>` +
      `<path d="M${xs[0]} 90 H${xs[xs.length-1]}"/>` +
      xs.map(x=>`<path d="M${x} 90 V112"/>`).join('');
  }
  else if (s.t === 'judge'){
    const rows = s.items.map((it,k)=>`<div class="jrow" data-i="${k}" data-ans="${it.ans?1:0}">
        <span class="jno">${String(k+1).padStart(2,'0')}</span>
        <span class="jt">${esc(it.s)}</span>
        <span class="tip"></span>
        <span class="jbtns"><button data-v="1">对</button><button data-v="0">错</button></span>
      </div>`).join('');
    d.innerHTML = darkShell(s,
      `<div class="kick">${esc(s.kicker)}</div>
       <h2 class="tt" style="font-size:44px">${esc(s.title)}</h2>
       <div class="jlist">${rows}</div>
       <div class="jfoot"><div class="jscore">答对 <b id="jok">0</b> / ${s.items.length}</div>
         <button class="jreset" id="jreset">重做</button></div>`, s.ghost);
  }
  else if (s.t === 'match'){
    const L = s.pairs.map((p,k)=>`<button class="mitem" data-side="L" data-i="${k}">
        <span class="dot"></span><span>${esc(p.l)}</span></button>`).join('');
    const R = s.order.map((oi,pos)=>`<button class="mitem" data-side="R" data-i="${oi}">
        <span class="dot"></span><span>${esc(s.pairs[oi].r)}</span></button>`).join('');
    d.innerHTML = darkShell(s,
      `<div class="kick">${esc(s.kicker)}</div>
       <h2 class="tt" style="font-size:44px">${esc(s.title)}</h2>
       <div class="mgrid">
         <div class="mcol">${L}</div>
         <div class="mid">→</div>
         <div class="mcol">${R}</div>
       </div>
       <div class="mfoot"><div class="jscore" id="mscore">已配对 <b>0</b> / ${s.pairs.length}</div>
         <button class="jreset" id="mreset">重做</button></div>`, s.ghost);
  }
  else if (s.t === 'home'){
    const cards = s.items.map((it,k)=>`<div class="hwcard" style="--c:${it.color}">
        <div class="tag">${esc(it.tag)}</div>
        <div class="hwt">${esc(it.text).split("\n").join("<br>")}</div>
        <div class="num">${k+1}</div></div>`).join('');
    d.innerHTML = darkShell(s,
      `<div class="kick">${esc(s.kicker)}</div>
       <h2 class="tt" style="font-size:48px">${esc(s.title)}</h2>
       <div class="lead" style="font-size:21px;margin-top:14px">${esc(s.lead)}</div>
       <div class="hw">${cards}</div>
       <div class="sum" style="margin-top:28px;border-left:3px solid #8C2F1F;color:#E5D9C2;font-size:19px;padding-left:14px">${esc(s.summary)}</div>`,
      s.ghost);
  }
  return d;
}

/* ── 初始化 ───────────────────────────── */
const slides = [];
DATA.slides.forEach((s,i)=>{
  const el = renderSlide(s,i);
  stage.appendChild(el);
  slides.push(el);
});
document.title = DATA.title;

let cur = 0;
const pn = document.getElementById('pn');
const bar = document.querySelector('#bar i');

function show(i, opts){
  i = Math.max(0, Math.min(slides.length-1, i));
  slides[cur].classList.remove('on');
  cur = i;
  slides[cur].classList.add('on');
  pn.textContent = (cur+1) + ' / ' + slides.length;
  bar.style.width = ((cur+1)/slides.length*100) + '%';
  try{ history.replaceState(null,'','#'+(cur+1)); }catch(e){}
  if (AUTO_REVEAL) revealAll();
  buildToc();
}
function next(){ if (revealNext()) return; if (cur < slides.length-1) show(cur+1); }
function prev(){ if (cur > 0) show(cur-1); }

/* 术语揭示 */
const AUTO_REVEAL = /[?&]all=1/.test(location.search);
function uncover(c){
  c.classList.remove('masked'); c.classList.add('revealed');
  const seal = c.querySelector('.seal');
  if (seal) seal.classList.add('gone');
}
function revealAll(){ slides[cur].querySelectorAll('.card.masked').forEach(uncover); }
function revealNext(){
  const cards = slides[cur].querySelectorAll('.card.masked');
  if (!cards.length) return false;
  uncover(cards[0]);
  return true;
}

/* ── 键盘 / 滚轮 / 触摸 ────────────────── */
document.addEventListener('keydown', e=>{
  const k = e.key;
  if (k === 'Escape'){ document.getElementById('overlay').classList.remove('on'); return; }
  if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || k === ' ' || k === 'Enter'){
    e.preventDefault(); next();
  } else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp'){
    e.preventDefault(); prev();
  } else if (k === 'Home'){ e.preventDefault(); show(0); }
  else if (k === 'End'){ e.preventDefault(); show(slides.length-1); }
  else if (k === 't' || k === 'T'){ toggleToc(); }
  else if (k === 'f' || k === 'F'){ toggleFs(); }
  else if (k === 'r' || k === 'R'){ resetPage(); }
});

let wheelLock = 0;
window.addEventListener('wheel', e=>{
  const now = Date.now();
  if (now - wheelLock < 620) return;
  if (Math.abs(e.deltaY) < 12) return;
  wheelLock = now;
  if (e.deltaY > 0) next(); else prev();
}, {passive:true});

let tx = 0, ty = 0;
window.addEventListener('touchstart', e=>{ tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
window.addEventListener('touchend', e=>{
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 54 && Math.abs(dx) > Math.abs(dy)){ dx < 0 ? next() : prev(); }
}, {passive:true});

/* ── 术语卡点击 ───────────────────────── */
stage.addEventListener('click', e=>{
  const card = e.target.closest('.card.masked');
  if (card){ revealNext(); return; }
  const tocRow = e.target.closest('.toc-row');
  if (tocRow){ show(parseInt(tocRow.dataset.goto,10)-1); return; }
  const node = e.target.closest('.mm-node');
  if (node){ node.classList.toggle('done'); return; }
  const lb = e.target.closest('.jbtns button');
  if (lb){ judgePick(lb); return; }
  const mi = e.target.closest('.mitem');
  if (mi){ matchPick(mi); return; }
  if (e.target.id === 'jreset'){ resetPage(); }
  if (e.target.id === 'mreset'){ resetPage(); }
});

/* ── 判断题逻辑 ───────────────────────── */
function judgePick(btn){
  const row = btn.closest('.jrow');
  if (row.classList.contains('ok') || row.classList.contains('ng')) return;
  const ans = row.dataset.ans === '1';
  const pick = btn.dataset.v === '1';
  const right = pick === ans;
  row.classList.add(right ? 'ok' : 'ng');
  btn.classList.add('picked');
  const tip = row.querySelector('.tip');
  if (right) tip.innerHTML = '<b>✓</b> 判断正确';
  else tip.innerHTML = '应为 <b>' + (ans ? '对' : '错') + '</b>';
  updateJudge();
}
function updateJudge(){
  const s = slides[cur];
  if (!s.classList.contains('t-judge')) return;
  const rows = s.querySelectorAll('.jrow');
  let ok = 0, done = 0;
  rows.forEach(r=>{ if (r.classList.contains('ok')) ok++; if (r.classList.contains('ok')||r.classList.contains('ng')) done++; });
  const box = s.querySelector('#jok');
  if (box) box.textContent = ok;
  const foot = s.querySelector('.jfoot .jscore');
  if (foot && done === rows.length){
    foot.innerHTML = '答对 <b>' + ok + '</b> / ' + rows.length +
      (ok === rows.length ? ' 　全对' : '　错的回看对应术语页');
  }
}

/* ── 配对题逻辑 ───────────────────────── */
const MCOLORS = ['#8C2F1F','#2F5D62','#7A5A24','#6B3F5E','#3F5D3A','#4A4152'];
function matchPick(el){
  const s = slides[cur];
  if (!s.classList.contains('t-match')) return;
  if (el.classList.contains('matched')) return;
  const side = el.dataset.side;
  if (side === 'L'){
    s.querySelectorAll('.mitem[data-side="L"].sel').forEach(x=>x.classList.remove('sel'));
    el.classList.add('sel');
    return;
  }
  const left = s.querySelector('.mitem[data-side="L"].sel');
  if (!left) return;
  const li = parseInt(left.dataset.i,10), ri = parseInt(el.dataset.i,10);
  const color = MCOLORS[li % MCOLORS.length];
  const n = li + 1;
  [left, el].forEach(x=>{
    x.classList.add('matched','locked');
    if (li !== ri) x.classList.add('bad');
    const dot = x.querySelector('.dot');
    dot.style.background = color;
    dot.style.borderColor = color;
    dot.textContent = n;
  });
  left.classList.remove('sel');
  const done = s.querySelectorAll('.mitem[data-side="L"].matched').length;
  const box = s.querySelector('#mscore b');
  if (box) box.textContent = done;
  if (done === s.querySelectorAll('.mitem[data-side="L"]').length){
    const bad = s.querySelectorAll('.mitem.bad').length / 2;
    const foot = s.querySelector('#mscore');
    foot.innerHTML = bad === 0
      ? '全部正确 <b>' + done + '</b> / ' + done
      : '有 <b>' + bad + '</b> 组不匹配，墨青色即错项';
  }
}

/* ── 重置当前页 ───────────────────────── */
function resetPage(){
  const s = slides[cur];
  s.querySelectorAll('.card.revealed').forEach(c=>{
    c.classList.remove('revealed'); c.classList.add('masked');
    const seal = c.querySelector('.seal');
    if (seal) seal.classList.remove('gone');
  });
  s.querySelectorAll('.jrow').forEach(r=>{
    r.classList.remove('ok','ng');
    r.querySelectorAll('button').forEach(b=>b.classList.remove('picked'));
    r.querySelector('.tip').innerHTML = '';
  });
  s.querySelectorAll('.mitem').forEach(m=>{
    m.classList.remove('sel','matched','locked','bad');
    const d = m.querySelector('.dot');
    d.style.background = ''; d.style.borderColor = ''; d.textContent = '';
  });
  if (s.querySelector('#jok')) s.querySelector('#jok').textContent = '0';
  if (s.querySelector('#mscore')) s.querySelector('#mscore').innerHTML = '已配对 <b>0</b> / 6';
  s.querySelectorAll('.mm-node.done').forEach(n=>n.classList.remove('done'));
  updateJudge();
}

/* ── 目录浮层 ─────────────────────────── */
const overlay = document.getElementById('overlay');
const ovgrid = document.getElementById('ovgrid');
function toggleToc(){ overlay.classList.toggle('on'); buildToc(); }
function buildToc(){
  if (!overlay.classList.contains('on')) return;
  ovgrid.innerHTML = DATA.slides.map((s,i)=>
    `<button data-goto="${i+1}" class="${i===cur?'cur':''}">
      <span class="n">${String(i+1).padStart(2,'0')}</span>
      <span class="t">${esc(s.title)}</span></button>`).join('');
}
ovgrid.addEventListener('click', e=>{
  const b = e.target.closest('button[data-goto]');
  if (b){ show(parseInt(b.dataset.goto,10)-1); overlay.classList.remove('on'); }
});
document.getElementById('ovclose').onclick = ()=> overlay.classList.remove('on');
document.getElementById('tocBtn').onclick = toggleToc;
document.getElementById('prev').onclick = prev;
document.getElementById('next').onclick = next;
document.getElementById('fsBtn').onclick = toggleFs;
function toggleFs(){
  if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  else document.exitFullscreen && document.exitFullscreen();
}

/* ── 启动 ─────────────────────────────── */
const start = parseInt((location.hash||'').replace('#',''),10);
show(isNaN(start) ? 0 : start-1);

/* 地址栏里改 #页码（或被外部容器用锚点跳转）时跟着翻页 */
window.addEventListener('hashchange', function(){
  const n = parseInt((location.hash||'').replace('#',''),10);
  if (!isNaN(n) && n >= 1 && n <= slides.length) show(n-1);
});
</script>
