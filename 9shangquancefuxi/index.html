<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>九上道法 · 全册复习与练习（第1—10课）</title>
<style>
  :root{
    --red:#C42819; --hred:#E63F26; --dred:#A81810; --gold:#E19825; --lgold:#FFE79B; --sgold:#FFC000;
    --ink:#171616; --gray:#6B7280; --lgray:#9CA3AF; --border:#E5E7EB; --bg:#FAF7F2; --card:#FFFFFF;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 16px 60px;}

  /* 顶部 */
  header{background:linear-gradient(135deg,var(--dred) 0%,var(--red) 55%,var(--hred) 100%);color:#fff;padding:34px 0 26px;position:relative;overflow:hidden;}
  header::after{content:"";position:absolute;right:-80px;top:-120px;width:360px;height:360px;background:rgba(255,215,0,.10);border-radius:50%;}
  .hwrap{max-width:1080px;margin:0 auto;padding:0 16px;position:relative;z-index:1;}
  .h-kicker{display:inline-block;background:var(--gold);color:var(--dred);font-weight:bold;font-size:13px;padding:4px 14px;border-radius:999px;letter-spacing:2px;}
  header h1{font-size:30px;margin:14px 0 6px;letter-spacing:2px;}
  header p{color:var(--lgold);font-size:15px;}
  .totalbar{margin-top:16px;background:rgba(0,0,0,.18);border-radius:10px;padding:10px 16px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .totalbar .bar{flex:1;min-width:180px;height:8px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden;}
  .totalbar .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--lgold),var(--sgold));width:0%;transition:width .5s;}

  /* 单元与课程卡片 */
  .unit{margin-top:34px;}
  .unit h2{font-size:20px;display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .unit h2::before{content:"";width:6px;height:22px;background:var(--red);border-radius:3px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;}
  .lcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 18px 14px;cursor:pointer;transition:.18s;position:relative;}
  .lcard:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(196,40,25,.13);border-color:var(--hred);}
  .lcard .no{position:absolute;top:-12px;left:16px;background:var(--red);color:#fff;font-weight:bold;font-size:13px;padding:3px 12px;border-radius:999px;}
  .lcard h3{font-size:19px;margin:8px 0 2px;}
  .lcard .sub{font-size:13px;color:var(--gray);margin-bottom:10px;}
  .lcard .meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--lgray);border-top:1px dashed var(--border);padding-top:9px;}
  .lcard .score{font-weight:bold;color:var(--dred);}
  .lcard .score.none{color:var(--lgray);}
  .go{background:var(--red);color:#fff;font-size:13px;padding:5px 14px;border-radius:99px;border:none;}

  /* 课程弹层 */
  .modal{position:fixed;inset:0;background:rgba(23,22,22,.55);display:none;z-index:50;overflow-y:auto;}
  .modal.open{display:block;}
  .sheet{max-width:860px;margin:30px auto;background:var(--bg);border-radius:18px;overflow:hidden;min-height:200px;}
  .sheet-head{background:linear-gradient(135deg,var(--dred),var(--hred));color:#fff;padding:20px 24px;position:sticky;top:0;z-index:5;}
  .sheet-head .tag{background:var(--gold);color:var(--dred);font-size:12px;font-weight:bold;padding:3px 10px;border-radius:99px;}
  .sheet-head h2{font-size:22px;margin-top:8px;}
  .sheet-head p{color:var(--lgold);font-size:13px;}
  .close{position:absolute;right:16px;top:16px;background:rgba(255,255,255,.2);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;}
  .tabs{display:flex;background:#fff;border-bottom:2px solid var(--border);position:sticky;top:0;z-index:4;}
  .tabs button{flex:1;padding:13px 6px;border:none;background:none;font-size:15px;cursor:pointer;color:var(--gray);font-weight:bold;border-bottom:3px solid transparent;}
  .tabs button.on{color:var(--red);border-bottom-color:var(--red);}
  .pane{display:none;padding:20px 22px 30px;}
  .pane.on{display:block;}

  /* 知识点卡片 */
  .kcard{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:12px;}
  .kcard h4{color:var(--dred);font-size:16px;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
  .kcard h4::before{content:"◆";color:var(--gold);font-size:12px;}
  .kcard li{margin:5px 0 5px 20px;font-size:14.5px;}
  .kcard li::marker{color:var(--gold);}
  .mustbox{background:linear-gradient(135deg,#FFF9EC,#FFF3D6);border:1.5px solid var(--gold);border-radius:12px;padding:14px 18px;margin-bottom:12px;}
  .mustbox h4{color:var(--dred);font-size:15px;margin-bottom:6px;}
  .mustbox li{margin:4px 0 4px 20px;font-size:14.5px;}
  .sumbox{background:#fff;border-left:5px solid var(--red);border-radius:0 12px 12px 0;padding:12px 16px;margin-bottom:10px;font-size:14.5px;}
  .hwbox{background:#fff;border-left:5px solid var(--gold);border-radius:0 12px 12px 0;padding:12px 16px;font-size:14.5px;}

  /* 重难点 */
  .zcard{background:#fff;border:1.5px solid var(--hred);border-radius:12px;padding:16px 18px;margin-bottom:12px;}
  .zcard .ztag{display:inline-block;background:var(--red);color:#fff;font-size:12px;padding:2px 10px;border-radius:99px;margin-bottom:8px;}
  .zcard li{margin:6px 0 6px 20px;font-size:15px;}
  .tipcard{background:linear-gradient(135deg,#FDF2EE,#FBE7DF);border-radius:12px;padding:14px 18px;font-size:14.5px;color:var(--dred2,#7a2a1d);}
  .srcline{margin-top:14px;font-size:12.5px;color:var(--lgray);text-align:right;}

  /* 练习 */
  .quiz-top{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  .quiz-top .info{font-size:14px;color:var(--gray);}
  .qcard{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:12px;}
  .qcard .qno{display:inline-block;background:var(--lgold);color:var(--dred);font-weight:bold;font-size:12px;padding:2px 10px;border-radius:99px;margin-right:8px;}
  .qcard .qtype{font-size:12px;color:var(--lgray);margin-right:6px;}
  .qcard .qtext{font-size:15.5px;margin:8px 0 12px;}
  .opt{display:block;width:100%;text-align:left;border:1.5px solid var(--border);background:#FBFBFB;border-radius:10px;padding:10px 14px;font-size:14.5px;margin-bottom:8px;cursor:pointer;transition:.15s;}
  .opt:hover{border-color:var(--gold);}
  .opt.sel{border-color:var(--red);background:#FDF2EE;}
  .opt.right{border-color:#1E9E55;background:#EDF9F2;}
  .opt.wrong{border-color:var(--red);background:#FDECEA;}
  .opt b{color:var(--dred);margin-right:6px;}
  .tfrow{display:flex;gap:10px;margin-bottom:10px;}
  .tfrow .opt{flex:0 0 100px;text-align:center;}
  .fillrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .fillrow input{border:1.5px solid var(--border);border-radius:8px;padding:8px 12px;font-size:14.5px;min-width:130px;outline:none;}
  .fillrow input:focus{border-color:var(--gold);}
  .fillrow input.right{border-color:#1E9E55;background:#EDF9F2;}
  .fillrow input.wrong{border-color:var(--red);background:#FDECEA;}
  .btn{border:none;border-radius:99px;padding:8px 20px;font-size:14px;cursor:pointer;font-weight:bold;}
  .btn-red{background:var(--red);color:#fff;}
  .btn-ghost{background:#fff;color:var(--red);border:1.5px solid var(--red);}
  .fb{font-size:14px;margin-top:6px;display:none;padding:10px 14px;border-radius:10px;}
  .fb.ok{display:block;background:#EDF9F2;color:#14683A;border:1px solid #BFE6CF;}
  .fb.no{display:block;background:#FDECEA;color:#8A1206;border:1px solid #F3C2BB;}
  .result{background:linear-gradient(135deg,#FFF6E3,#FFEFCB);border:1.5px solid var(--gold);border-radius:14px;padding:18px 22px;margin-top:6px;display:none;}
  .result.show{display:block;}
  .result .big{font-size:30px;font-weight:bold;color:var(--dred);}
  /* 实时计分条 */
  .live{background:linear-gradient(135deg,#FFFDF8,#FFF6E3);border:1.5px solid var(--gold);border-radius:12px;padding:12px 16px;margin-bottom:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .live .sc{font-size:14px;color:var(--gray);white-space:nowrap;}
  .live .sc b{font-size:26px;color:var(--red);margin:0 2px;}
  .live .sub{font-size:13px;color:var(--gray);white-space:nowrap;}
  .live .pbar{flex:1;min-width:110px;height:8px;background:#EFE8DA;border-radius:99px;overflow:hidden;}
  .live .pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--red));border-radius:99px;transition:width .35s;}
  .qstate{float:right;font-size:12.5px;font-weight:bold;padding:2px 10px;border-radius:99px;display:none;}
  .qstate.ok{display:inline-block;background:#EDF9F2;color:#14683A;border:1px solid #BFE6CF;}
  .qstate.no{display:inline-block;background:#FDECEA;color:#8A1206;border:1px solid #F3C2BB;}
  .result .line{display:flex;gap:26px;flex-wrap:wrap;margin:10px 0 4px;}
  .result .line div{font-size:13.5px;color:var(--gray);}
  .result .line b{display:block;font-size:20px;color:var(--dred);}
  .btn-row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
  footer{text-align:center;color:var(--lgray);font-size:12.5px;margin-top:50px;}
  @media (max-width:600px){ header h1{font-size:23px;} .sheet{margin:10px;} .pane{padding:16px 14px 24px;} }
</style>
</head>
<body>

<header>
  <div class="hwrap">
    <span class="h-kicker">九年级上册 · 道德与法治</span>
    <h1>全册复习与练习（第 1—10 课）</h1>
    <p>知识点复习 · 教材重难点 · 每课 9 题（6 选择 + 3 判断）· 作答即判分，自动统计得分</p>
    <div class="totalbar">
      <span id="totalText">已完成 0 / 10 课</span>
      <div class="bar"><i id="totalBar"></i></div>
      <span id="totalScore">累计最高分 0 / 90</span>
    </div>
  </div>
</header>

<div class="wrap">
  <div id="units"></div>
  <footer>与希沃课堂课件（全册 10 课）配套 · 点击课程卡片开始复习 · 进度自动保存在本机</footer>
</div>

<!-- 课程弹层 -->
<div class="modal" id="modal">
  <div class="sheet">
    <div class="sheet-head">
      <button class="close" onclick="closeModal()">✕</button>
      <span class="tag" id="mTag"></span>
      <h2 id="mTitle"></h2>
      <p id="mSub"></p>
    </div>
    <div class="tabs">
      <button class="on" data-t="0" onclick="switchTab(0)">📖 知识复习</button>
      <button data-t="1" onclick="switchTab(1)">⭐ 教材重难点</button>
      <button data-t="2" onclick="switchTab(2)">📝 课堂练习</button>
    </div>
    <div class="pane on" id="pane0"></div>
    <div class="pane" id="pane1"></div>
    <div class="pane" id="pane2"></div>
  </div>
</div>

/* ================= 数据 ================= */

const LESSONS = [

 must:["五四运动：1919 年，新民主主义革命的开端","中共一大：1921 年，宣告中国共产党成立","四个时期对应四大贡献，错一个就丢分","伟大建党精神 32 字、分 4 组，是精神之源"],

/* ================= 首页渲染 ================= */
const store = JSON.parse(localStorage.getItem("df9a_progress")||"{}");
function saveStore(){localStorage.setItem("df9a_progress",JSON.stringify(store));}

function renderHome(){
  const box=document.getElementById("units");box.innerHTML="";
  UNITS.forEach((u,ui)=>{
    const ls=LESSONS.filter(l=>!l.hide&&l.unit===ui);
    const sec=document.createElement("div");sec.className="unit";
    sec.innerHTML="<h2>"+u+"</h2>";
    const grid=document.createElement("div");grid.className="cards";
    ls.forEach(l=>{
      const st=store[l.no]||{};
      const card=document.createElement("div");card.className="lcard";
      const stat=st.best!=null
        ? '最高 <span class="score">'+st.best+' / 9</span>　最近 '+st.last+' 分　已练 '+(st.tries||1)+' 次'
        : '练习最高分：<span class="score none">未挑战</span>';
      card.innerHTML='<span class="no">第 '+l.no+' 课</span><h3>'+l.title+'</h3><div class="sub">'+l.sub+
        '</div><div class="meta"><span style="font-size:12.5px">'+stat+'</span><button class="go">进入复习 ›</button></div>';
      card.onclick=()=>openLesson(l.no);
      grid.appendChild(card);
    });
    sec.appendChild(grid);box.appendChild(sec);
  });
  renderTotal();
}
function renderTotal(){
  const nos=LESSONS.filter(l=>!l.hide).map(l=>l.no);
  const done=nos.filter(n=>store[n]&&store[n].best!=null).length;
  const sum=nos.reduce((s,n)=>s+((store[n]&&store[n].best)||0),0);
  document.getElementById("totalText").textContent="已完成 "+done+" / "+nos.length+" 课";
  document.getElementById("totalBar").style.width=(done/nos.length*100)+"%";
  document.getElementById("totalScore").textContent="累计最高分 "+sum+" / "+(nos.length*9);
}

/* ================= 弹层 ================= */
let cur=null;
function openLesson(no){
  cur=LESSONS.find(l=>l.no===no);
  document.getElementById("mTag").textContent="第 "+cur.no+" 课 · "+UNITS[cur.unit];
  document.getElementById("mTitle").textContent=cur.title;
  document.getElementById("mSub").textContent=cur.sub;
  // pane0 知识
  let h=cur.k.map(c=>'<div class="kcard"><h4>'+c.h+'</h4><ul>'+c.b.map(x=>"<li>"+x+"</li>").join("")+"</ul></div>").join("");
  h+='<div class="mustbox"><h4>✦ 本课必背清单</h4><ul>'+cur.must.map(x=>"<li>"+x+"</li>").join("")+"</ul></div>";
  h+='<div class="sumbox"><b>三句话小结：</b><br>'+cur.sum.map(s=>"· "+s).join("<br>")+"</div>";
  h+='<div class="hwbox"><b>课后作业：</b><br>'+cur.hw.map((x,i)=>"· "+(i+1)+"．"+x).join("<br>")+"</div>";
  document.getElementById("pane0").innerHTML=h;
  // pane1 重难点
  let z='<div class="zcard"><span class="ztag">教材重难点</span><ul>'+
    cur.znd.items.map(x=>"<li>"+x+"</li>").join("")+"</ul></div>"+
    '<div class="tipcard"><b>学习提示（依据教师教学用书）：</b>'+cur.znd.tip+"</div>"+
    '<div class="srcline">出处：'+cur.znd.src+'</div>';
  document.getElementById("pane1").innerHTML=z;
  // pane2 练习
  buildQuiz();
  switchTab(0);
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow="hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow="";
  renderHome();
}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});
function switchTab(i){
  document.querySelectorAll(".tabs button").forEach((b,j)=>b.classList.toggle("on",j===i));
  document.querySelectorAll(".pane").forEach((p,j)=>p.classList.toggle("on",j===i));
}

/* ================= 练习 ================= */
let answers=[], startTime=0, timerId=null;
function typeName(t){return t==="c"?"选择题":"判断题";}
function buildQuiz(){
  answers=cur.quiz.map(()=>({sel:null,checked:false,right:false}));
  startTime=Date.now();
  const wrong=(store[cur.no]&&store[cur.no].wrong)||[];
  const nc=cur.quiz.filter(q=>q.t==="c").length, nf=cur.quiz.filter(q=>q.t==="f").length;
  let h='<div class="live" id="live">'+
    '<div class="sc">当前得分 <b id="liveScore">0</b> 分 <span class="sub">/ '+cur.quiz.length+' 分</span></div>'+
    '<div class="pbar"><i id="liveBar"></i></div>'+
    '<div class="sub">已答 <span id="liveDone">0</span> / '+cur.quiz.length+' 题 · 正确率 <span id="liveRate">—</span></div>'+
    '<button class="btn btn-ghost" onclick="buildQuiz()">重做本课</button></div>'+
    '<div class="quiz-top"><div class="info">共 '+cur.quiz.length+' 题：选择题 '+nc+' · 判断题 '+nf+
      '　｜　每题 1 分，答对得分、答错不扣分，作答后立即判分'+
      (wrong.length?'<br>上次错题：第 '+wrong.join("、")+' 题':'')+
    '</div></div>';
  cur.quiz.forEach((q,qi)=>{
    h+='<div class="qcard" id="qc'+qi+'">';
    h+='<span class="qtype">'+typeName(q.t)+'</span><span class="qno">第 '+(qi+1)+' 题</span><span class="qstate" id="qs'+qi+'"></span>';
    h+='<div class="qtext">'+q.q+'</div>';
    if(q.t==="c"){
      q.o.forEach((o,oi)=>{
        h+='<button class="opt" id="o'+qi+'_'+oi+'" onclick="pick('+qi+','+oi+')"><b>'+"ABCD"[oi]+'.</b>'+o+'</button>';
      });
    }else{
      h+='<div class="tfrow">'+
        '<button class="opt" id="o'+qi+'_1" onclick="pick('+qi+',1)">√ 正确</button>'+
        '<button class="opt" id="o'+qi+'_0" onclick="pick('+qi+',0)">× 错误</button></div>';
    }
    h+='<div class="fb" id="fb'+qi+'"></div></div>';
  });
  h+='<div class="result" id="result"></div>';
  document.getElementById("pane2").innerHTML=h;
  updateLive();
}
function pick(qi,oi){
  if(answers[qi].checked)return;              // 已判分，锁定本题
  const q=cur.quiz[qi];
  answers[qi].sel=oi;
  const tag=document.getElementById("qs"+qi);
  const fb=document.getElementById("fb"+qi);
  let right=false,ansTxt="";
  if(q.t==="c"){
    right=oi===q.a;
    for(let i=0;i<q.o.length;i++){
      const el=document.getElementById("o"+qi+"_"+i);el.classList.remove("sel");
      if(i===q.a)el.classList.add("right");
      else if(i===oi)el.classList.add("wrong");
    }
    ansTxt="正确答案："+"ABCD"[q.a]+"。";
  }else{
    const want=q.a?1:0;
    right=oi===want;
    ["1","0"].forEach(k=>{
      const el=document.getElementById("o"+qi+"_"+k);el.classList.remove("sel");
      if(parseInt(k)===want)el.classList.add("right");
      else if(parseInt(k)===oi)el.classList.add("wrong");
    });
    ansTxt="正确答案："+(q.a?"√":"×")+"。";
  }
  answers[qi].checked=true;answers[qi].right=right;
  tag.className="qstate "+(right?"ok":"no");
  tag.textContent=right?"✓ +1 分":"✗ 0 分";
  fb.className="fb "+(right?"ok":"no");
  fb.innerHTML=(right?"✓ 回答正确，得 1 分　":"✗ 回答错误，本题不得分　")+ansTxt+" "+q.exp;
  updateLive();
}
function doneCount(){return answers.filter(a=>a.checked).length;}
function scoreNow(){return answers.filter(a=>a.right).length;}
function updateLive(){
  const total=cur.quiz.length, done=doneCount(), sc=scoreNow();
  const s=document.getElementById("liveScore");if(!s)return;
  s.textContent=sc;
  document.getElementById("liveDone").textContent=done;
  document.getElementById("liveRate").textContent=done?(Math.round(sc/done*100)+"%"):"—";
  document.getElementById("liveBar").style.width=(done/total*100)+"%";
  if(done===total)finish();
}
function fmtDur(ms){
  const s=Math.round(ms/1000);
  return Math.floor(s/60)+" 分 "+(s%60)+" 秒";
}
function finish(){
  const total=cur.quiz.length, sc=scoreNow(), done=doneCount();
  if(done<total)return;
  const dur=fmtDur(Date.now()-startTime);
  const wrongs=[];
  cur.quiz.forEach((q,qi)=>{if(!answers[qi].right)wrongs.push(qi+1);});
  const st=store[cur.no]||{};
  if(st.best==null||sc>st.best)st.best=sc;
  st.last=sc;st.tries=(st.tries||0)+1;st.wrong=wrongs;st.time=dur;
  store[cur.no]=st;saveStore();renderTotal();
  let level,msg;
  const rate=Math.round(sc/total*100);
  if(sc===total){level="满分 · 优秀";msg="🎉 全对！本课知识点已经掌握得很扎实了！";}
  else if(rate>=80){level="优秀";msg="👍 很稳！把错题的讲解再看一遍，就能冲满分。";}
  else if(rate>=60){level="合格";msg="💪 过半偏上，建议回“知识复习”把必背清单再过一遍。";}
  else{level="待提高";msg="📖 建议先完整复习“知识复习”和“重难点”两页，再重新挑战。";}
  const res=document.getElementById("result");
  res.className="result show";
  res.innerHTML='<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">'+
      '<span class="big">得分 '+sc+' / '+total+' 分</span>'+
      '<span style="background:#fff;border-radius:99px;padding:3px 12px;font-size:13px;color:#8A1206;font-weight:bold">'+level+'</span></div>'+
    '<div class="line"><div>正确率<b>'+rate+'%</b></div><div>答对<b>'+sc+' 题</b></div>'+
    '<div>答错<b>'+wrongs.length+' 题</b></div><div>用时<b>'+dur+'</b></div></div>'+
    '<div style="font-size:14.5px;margin-top:6px">'+msg+(wrongs.length?'<br>错题：第 '+wrongs.join("、")+' 题（已记录，重做时可留意）。':'')+'</div>'+
    '<div class="btn-row"><button class="btn btn-ghost" onclick="buildQuiz()">重新挑战本课</button>'+
    '<button class="btn btn-ghost" onclick="closeModal()">返回课程列表</button></div>';
  res.scrollIntoView({behavior:"smooth",block:"center"});
}

renderHome();
</script>
